<script>
// GitHub Pages sirve este 404.html para cualquier ruta inexistente: vuelve a index.html conservando el hash
// (las secciones de la web son rutas hash, p. ej. #tarjetas). Sin hash, un único tramo de ruta (…/tarjetas)
// se convierte en hash (#tarjetas); index.html muestra su propio aviso si la sección no existe.
(function(){
  var base = "/historia-filosofia-web-ar/", h = location.hash;
  if (!h) { var rest = location.pathname.indexOf(base) === 0 ? location.pathname.slice(base.length).replace(/\/+$/, "") : "";
    if (/^[a-z0-9_-]+$/i.test(rest) && rest !== "index.html") h = "#" + rest; }
  location.replace(base + h);
})();
</script>
