<body style="margin:0">
<title>Arrazoien dueloa</title>
<meta name="description" content="Pentsamendu kritikoko eztabaida-jokoa: gai bati buruzko elkarrizketa bat, non aurkariaren falazia seinalatzea edo arrazoi sendoago batekin kontraerasotzea erabakitzen duzun, patxada galdu gabe.">

<style>
  /* Layout: un hilo de conversación con el medidor de público y el temple arriba, y abajo tus dos jugadas. */
  :root{
    --bg:#e8eaf0; --surface:#ffffff; --surface-2:#f1f2f7; --ink:#191d28; --muted:#5a6173;
    --line:#d3d7e2; --accent:#4356d6; --good:#15806a; --good-ink:#0a4b3e; --bad:#c4362a; --bad-ink:#7c1d16;
    --warn:#b5691a; --cpu-bubble:#eceef5; --paper:#faf7ef; --paper-line:#e7dfcb; --shadow:0 10px 30px rgba(20,25,45,.12);
    --fdisp:"Bricolage Grotesque",Georgia,serif; --fbody:"Spline Sans",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#11141c; --surface:#1a1f2b; --surface-2:#222838; --ink:#e9ebf2; --muted:#9aa2b5;
    --line:#2d3446; --accent:#8a97f5; --good:#4cc3a3; --good-ink:#b8f0e2; --bad:#f08478; --bad-ink:#ffd6cf;
    --warn:#e2a15a; --cpu-bubble:#232a39; --paper:#20242f; --paper-line:#333a4c; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#11141c; --surface:#1a1f2b; --surface-2:#222838; --ink:#e9ebf2; --muted:#9aa2b5;
    --line:#2d3446; --accent:#8a97f5; --good:#4cc3a3; --good-ink:#b8f0e2; --bad:#f08478; --bad-ink:#ffd6cf;
    --warn:#e2a15a; --cpu-bubble:#232a39; --paper:#20242f; --paper-line:#333a4c; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--fbody);line-height:1.5;margin:0}
  .wrap{max-width:720px;margin:0 auto;padding-block:20px;padding-inline:16px}
  h1,h2,h3{font-family:var(--fdisp);text-wrap:balance;margin:0}
  button{font-family:var(--fbody);cursor:pointer}
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;
    padding:12px 16px;font-size:1rem;font-weight:600;transition:transform .08s,border-color .15s,background .15s;width:100%}
  .btn:hover{border-color:var(--accent)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover{filter:brightness(1.05)}
  .center{text-align:center}

  .intro{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 22px;box-shadow:var(--shadow)}
  .eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .intro h1{font-size:clamp(2rem,7vw,3rem);margin:6px 0 10px;line-height:1.02}
  .lede{color:var(--muted);font-size:1.02rem;max-width:56ch;margin:0 auto}
  .rules{display:grid;gap:10px;margin:22px 0;text-align:left}
  .rule{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .rule .n{font-family:var(--fdisp);font-weight:800;color:var(--accent);font-size:1.3rem;line-height:1;min-width:1.2em}
  .rule p{margin:0;font-size:.95rem}
  .pick{display:grid;gap:10px;margin-top:6px;text-align:left}
  .pick .btn{width:100%}
  .pick .sides{display:block;color:var(--muted);font-weight:500;font-size:.82rem;margin-top:3px}

  .hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .temple{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;text-align:center;min-width:92px}
  .temple .who{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .temple .dots{font-size:1.05rem;letter-spacing:2px;line-height:1.2}
  .temple.low{border-color:var(--bad)} .temple.low .who{color:var(--bad)}
  .turnlbl{font-size:.82rem;color:var(--muted);font-weight:600}
  .turnlbl b{color:var(--ink);font-family:var(--fdisp)}

  .meter-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
  .meter-top{display:flex;justify-content:space-between;font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:6px}
  .meter-top .you{color:var(--good)} .meter-top .cpu{color:var(--bad)}
  .meter{height:12px;border-radius:999px;background:color-mix(in srgb,var(--bad) 35%,var(--surface-2));overflow:hidden;position:relative}
  .meter .fill{height:100%;background:var(--good);border-radius:999px;transition:width .5s ease}
  .meter .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--line)}

  .theme-topic{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:.9rem}
  .theme-topic b{font-family:var(--fdisp)}
  .theme-topic .you-side{color:var(--good);font-weight:600}

  .thread{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;max-height:46vh;overflow-y:auto;padding:2px}
  .bubble{max-width:88%;padding:11px 14px;border-radius:14px;font-size:.98rem;line-height:1.4}
  .bubble .nm{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:3px;opacity:.8}
  .bubble.cpu{align-self:flex-start;background:var(--cpu-bubble);border:1px solid var(--line);border-bottom-left-radius:4px}
  .bubble.cpu .nm{color:var(--bad)}
  .bubble.you{align-self:flex-end;background:color-mix(in srgb,var(--good) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--good) 40%,var(--line));border-bottom-right-radius:4px}
  .bubble.you .nm{color:var(--good-ink)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bubble.you .nm{color:var(--good)}}
  :root[data-theme="dark"] .bubble.you .nm{color:var(--good)}
  .bubble.latest{box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 45%,transparent)}

  .phase-tag{display:inline-flex;align-items:center;gap:7px;font-size:.82rem;font-weight:600;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:999px;padding:5px 12px;margin-bottom:10px}
  .phase-tag.hot{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
  .choices{display:grid;gap:10px}
  .choice{text-align:left;line-height:1.3}
  .choice small{display:block;color:var(--muted);font-weight:500;font-size:.82rem;margin-top:3px}
  .grid-fal{grid-template-columns:1fr 1fr}
  @media (max-width:470px){.grid-fal{grid-template-columns:1fr}}
  .btn-a{border-color:var(--bad)} .btn-a:hover{background:color-mix(in srgb,var(--bad) 10%,transparent)}
  .btn-b{border-color:var(--accent)} .btn-b:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .pips{font-size:.8rem;letter-spacing:1px;color:var(--accent);font-weight:700}
  .back{background:transparent;border:none;color:var(--muted);font-weight:600;font-size:.85rem;width:auto;padding:4px 2px;cursor:pointer}

  .fb{border-radius:16px;padding:16px;margin-top:4px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
  .fb.win{border-color:var(--good);background:color-mix(in srgb,var(--good) 9%,var(--surface))}
  .fb.lose{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
  .fb.mid{border-color:var(--warn)}
  .fb .head{font-family:var(--fdisp);font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px}
  .fb.win .head{color:var(--good-ink)} .fb.lose .head{color:var(--bad-ink)} .fb.mid .head{color:var(--warn)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fb.win .head{color:var(--good)} :root:not([data-theme="light"]) .fb.lose .head{color:var(--bad)}}
  :root[data-theme="dark"] .fb.win .head{color:var(--good)} :root[data-theme="dark"] .fb.lose .head{color:var(--bad)}
  .fb .name{margin-top:7px}
  .fb .desmonta{margin-top:8px;font-size:.92rem;background:var(--surface-2);border-radius:10px;padding:9px 12px}
  .fb .desmonta b{color:var(--accent)}
  .fb .schop{margin-top:8px;font-size:.82rem;color:var(--muted)} .fb .schop b{color:var(--warn)}
  .fb .delta{font-weight:700;font-family:var(--fdisp)} .fb .delta.pos{color:var(--good)} .fb .delta.neg{color:var(--bad)}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .brand{font-family:var(--fdisp);font-weight:800}
  .brand .accent{color:var(--accent)}
  .ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:.82rem;font-weight:600;color:var(--muted);width:auto}
  .foot{margin-top:18px;text-align:center;font-size:.78rem;color:var(--muted)}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none}}
  .verdict{font-family:var(--fdisp);font-weight:800;font-size:2rem;margin:6px 0}
  .verdict.win{color:var(--good)} .verdict.lose{color:var(--bad)} .verdict.tie{color:var(--warn)}
</style>

<div class="wrap">
  <div class="topbar">
    <div class="brand">Arrazoien <span class="accent">dueloa</span></div>
    <button class="ghost" id="theme">Itxura ◐</button>
  </div>
  <div id="app"></div>
  <div class="foot">Pentsamendu kritikoa · DBH 2 · Martín de Bertendona BHI. Ez du beti irabazten tranpa harrapatzen duenak: batzuetan arrazoiekin gogorren jotzen duenak irabazten du.</div>
</div>

  ]},
 {nivel:["fil","hf"], claim:"Justizia indartsuenaren komenentzia baino ez al da? · Sokrates vs. Trasimako",
  cpuLado:"Ordenagailua Trasimako da: bidegabea izatea errentagarriagoa eta zoriontsuagoa da; justiziak boteretsuari baino ez dio balio.",
  tuLado:"Zu Sokrates zara: justizia bertute bat da, duenari mesede egiten diona, eta bizitza zuzena zoriontsuagoa da.",
  estrat:[
   {t:"Piztia baten gisan sartzen da: «Hau da denbora guztian esaten ari zareten astakeria pila!»", nombre:"sarrera basatia", schop:"argudiatu aurretik izutzea", q:"Tonua ez da argudio bat. Zer esan behar du gaiaz?"},
   {t:"Barre-algara bota du: «Hor dago Sokratesen betiko ironia; banekien ihes egingo zenuela.»", nombre:"iseka", schop:"errefusatu ordez barregarri uztea", q:"Barre egiteak ez du ezer errefusatzen. Eskatu arrazoia."},
   {t:"«Sokrates, oraindik haurtzaina duzu? Mukiak dilindan uzten baitizu eta ez dizkizu garbitzen.»", nombre:"inudearen iraina", schop:"38. estratagema, «ultima ratio»-a", q:"Irain bat da, ez erantzun bat. Itzuli gaira."},
  ],
  opp:[
   {t:"Zuzenak beti ateratzen du gutxiago: ez du iruzurrik egiten negozioetan, zergak ordaintzen ditu eta, gobernatzean, besteei egiten die mesede eta ez bere buruari.", f:null},
   {t:"Mediku batek huts egiten duenean, une horretan ez du mediku gisa jokatzen. Berdin agintzen duenak: zentzu hertsian, agintariak ez du hutsik egiten.", f:"notrue", peso:1},
   {t:"Zuk irabazteko soilik galdetzen duzu, ohorearen maitasunagatik; ez duzu egia bilatzen, beraz zure galderek ez dute balio.", f:"persona", peso:3},
   {t:"Begira nor garaitzen den: tiranoak eta tranpatiak. Argi-argi dago bidegabekeriak egiten duela zoriontsu.", f:"pocos", peso:2},
   {t:"Edo bidegabea zara eta etekina ateratzen duzu, edo zuzena zara eta bizirik jaten zaituzte; ez dago erdiko biderik.", f:"dos", peso:2},
   {t:"Zuzena ustiatzen duten inozo bat da; bidegabea, ustiatzen duen azkarra. Edo bata edo bestea. Horregatik da bertutea bidegabekeria.", f:"dos", fAlt:["persona"], peso:2},
  ],
  counters:[
   {t:"Lapur-talde batek ere justizia apur bat behar du beren artean zerbait lortzeko; bidegabekeriak aurrez aurre jartzen eta suntsitzen ditu.", str:3},
   {t:"Agintariek huts egiten dute eta kalte egiten dieten legeak ematen dituzte; orduan, haiek betetzeak ez dio indartsuari mesederik egiten.", str:2},
   {t:"Medikuak, mediku den aldetik, gaixoaren ongia bilatzen du, ez berea; ongi agintzen duenak gobernatuaren ongia bilatzen du.", str:2},
   {t:"Arimaren eginkizuna bizitzea bada, eta justizia haren bertutea, zuzenak ongi bizi du; eta ongi bizitzea zoriontsu izatea da.", str:2},
   {t:"Sofista batek arrazoia izan gabe arrazoia izaten irakasteagatik kobratzen du; nola sinetsiko dizugu zuri?", f:"persona"},
   {t:"Edo onartzen duzu justizia bertute bat dela, edo aitortzen duzu lapurtzea gustatuko litzaizukeela; aukeratu.", f:"dos"},
  ]},
 {nivel:["hf"], claim:"Atheismusstreit (1798): ateoa al da Jainkoa munduaren ordena moralarekin identifikatzea?",
  cpuLado:"Ordenagailua Fichteren salatzaileak dira: hori ateismoa da, eta ateismoa debekatu egin behar da.",
  tuLado:"Fichte zara: fedea merezi duen Jainkoa munduaren ordena moral bizia da; aparteko Jainko-gauza bat idolo bat litzateke.",
  estrat:[
   {t:"Panfleto anonimo bat dabil, «Aita batek bere seme ikasleari gutuna»: zure aldizkaria irakurtzen duenak fedea eta arima galduko ditu.", nombre:"panfleto anonimoa", schop:"aurpegia eman gabe erasotzea (putzua pozoitzea)", q:"Itzalpean salatzen duenak ez du argudiatzen. Zer dio eta zer frogarekin?"},
   {t:"Saxoniako gobernuak aldizkaria konfiskatzeko eta irakurtzen duena zigortzeko mehatxua egiten du.", nombre:"zentsura-mehatxua", schop:"indarra arrazoien ordez (ad baculum)", q:"Ideia bat isilaraztea ez da errefusatzea. Non dago argudioa?"},
   {t:"«Ateoa!» Hitz horrekin nahikoa; ez dago zurekin gehiago hitz egitekorik.", nombre:"etiketa laidogarria", schop:"kategoria higuingarri batean sartzea", q:"Etiketak ez du ezer errefusatzen. Zertan datza zehazki esaten dudana?"},
  ],
  opp:[
   {t:"Substantzia, pertsona, ez sortzaile ez den Jainko bat, «ordena morala» besterik ez dena, zertan bereizten da Jainkorik ez edukitzetik?", f:null},
   {t:"Fichtek dio Jainkoa guk egiten dugun ideia bat baino ez dela; hau da, Jainkoa ukatzen du. Ateoa da.", f:"deformar", peso:3},
   {t:"Jainko pertsonala kentzen baduzu, morala, zina eta Estatua erortzen dira. Jada debekatu behar da.", f:"miedo", peso:3},
   {t:"Fichte jakobino eta istilugile bat da; jakina da nolako filosofia ateratzen den horrelako gizon batengandik.", f:"persona", peso:2},
   {t:"Kristautasun osoak aitortzen duen katiximak dio Jainkoa pertsona eta sortzaile dela; nor da bera hori zuzentzeko?", f:"siempre", peso:1},
   {t:"Jende zintzo guztia eskandalizatzen da aldizkari horrekin; zerbaitengatik izango da.", f:"todos", peso:1},
  ],
  counters:[
   {t:"Egiazko Jainkoa munduaren ordena moral bizia da, ongi jokatzean fidatzen zaren hura: hori ez da «nire ideia bat», errealena da.", str:3},
   {t:"Jainkoa gauza edo pertsona bihurtzea, izakien arteko izaki bat gehiago, idolo mailara jaistea da; idolo hori ukatzea ez da Jainkoa ukatzea.", str:3},
   {t:"Ideia bat zentsurarekin zigortzeak ez du errefusatzen: oker banago, frogatu ezazue, ez nazazue isilarazi.", str:2},
   {t:"Epaitu nire arrazoiak, ez nire politika: ni jakobino izateak edo ez izateak ez du esaten arrazoia dudan ala ez.", str:2},
   {t:"Edo nire idealismo osoa onartzen duzue, edo fanatiko sineskeriati batzuk zarete.", f:"dos"},
   {t:"Ni salatzen nauena apaiz ezjakin bat da, Kanten lerro bat ere irakurri ez duena.", f:"persona"},
  ]},
 {nivel:["fil","hf"], claim:"Descartesen dualismoa: gogoa eta gorputza bi substantzia dira ala bakarra?",
  cpuLado:"Ordenagailua da monista (Spinoza, La Mettrie): substantzia bakarra dago; arima bereizi bat soberan.",
  tuLado:"Descartes zara: gogoa pentsatzen duen gauza bat da, gorputz hedatuaz errealki bereizia.",
  estrat:[
   {t:"«Hori apaizen ipuina da: arima hilezkorra jendea izutzeko sineskeria da.»", nombre:"mesprezua", schop:"kategoria higuingarri batean sartzea", q:"Mesprezua ez da argumentu bat. Zer huts egiten du bereizketak, zehazki?"},
   {t:"«Zu, ‘pentsatzen dut, beraz banaiz’ delakoaren atzean ezkutatzen zarena, ez zara ausartzen gorputzari aurrez aurre begiratzen.»", nombre:"ziri pertsonala", schop:"ad hominem", q:"Nire izaerak ez du erabakitzen gogoa eta gorputza bereiziak diren ala ez."},
   {t:"«Utzi zure ‘argi eta bereizia’ horrekin zorabiatzeari eta hitz egin pertsona arrunt baten moduan.»", nombre:"iseka", schop:"errefusatu beharrean barregarri uztea", q:"Hiztegiaz barre egiteak ez du ideia errefusatzen."},
  ],
  opp:[
   {t:"Arima hedatua ez bada, ezin du gorputza bultzatu ez mugitu; ukipenak hedadura eskatzen du. Nola elkarreragiten dute, orduan?", f:null},
   {t:"Nahikoa da substantzia bakar bat bi atributurekin, pentsamendua eta hedadura, dena azaltzeko, nola ukitzen diren jakiten ez den bi mundurik gabe.", f:null},
   {t:"Zuretzat gorputza baliorik gabeko gartzela bat da eta arimak bakarrik du axola; haragi osoa mesprezatzen duzu.", f:"deformar", peso:3},
   {t:"Edo arima substantzia bereizi bat da, edo askatasunik gabeko makina bat besterik ez zara: aukeratu.", f:"dos", peso:2},
   {t:"Ardo zurrut batek zure pentsamenduak aldatzen ditu; beraz, pentsatzea gorputzaren kimika besterik ez da, ez dago arimarik.", f:"causa", peso:2},
   {t:"Mediku eta jakintsu modernoak materialistak dira denak; zuk bakarrik izango duzu arrazoia?", f:"todos", peso:1},
  ],
  counters:[
   {t:"Gorputza dudan zalantzan jar dezaket, baina ez pentsatzen dudala; eta argi eta bereizi bereizita ulertzen dudana, bereizita existi daiteke.", str:3},
   {t:"Gorputzak gogoan eragiteak ez du frogatzen gauza bera direnik: musikaria ez da bere instrumentua, jotzen badu ere.", str:3},
   {t:"Ez dut gorputza mesprezatzen: berarekin lotura oso estua osatzen dudala diot, ez gartzela bat denik.", str:2},
   {t:"Substantzia bakar bat sinpleagoa izateak ez du egiazko bihurtzen: oraindik azaldu behar da zergatik pentsatzen dudan lehen pertsonan.", str:2},
   {t:"Edo arima hilezkor bat onartzen duzu, edo duintasunik gabeko animalia bat zara: ez dago erdibiderik.", f:"dos"},
   {t:"Spinoza bere komunitatetik kanporatu zuten; nola sinetsiko diozu horrelako gizon bati?", f:"persona"},
  ]},
 {nivel:["hf"], claim:"Hegel Kanten aurka: arrazoiak muga igaroezinak ditu ala dena pentsa dezake?",
  cpuLado:"Ordenagailuak Kant defendatzen du: fenomenoak baino ez ditugu ezagutzen; gauzaz berez isildu egin behar da.",
  tuLado:"Hegel zara: muga horiek aurreiritzi bat dira; gauza bera hutsune bat da eta kontraesanak mugitzen du pentsamendua.",
  estrat:[
   {t:"«Zure esaldiak hain dira ilunak, non inork ez baitzaitu ulertzen; horrela erraza da sakon itxurak egitea.»", nombre:"ilun izateagatiko iseka", schop:"errefusatu beharrean barregarri uztea", q:"Ni irakurtzea kosta egiteak ez du errefusatzen diodana. Zer da faltsua, zehazki?"},
   {t:"«Zuk garrantzitsu ematearren idazten duzu, ez ezer argitzeko.»", nombre:"ziri pertsonala", schop:"ad hominem", q:"Nire estiloak ez du erabakitzen Kantek arrazoia zuen ala ez."},
   {t:"«Utzi ‘dialektika’ horrekin zorabiatzeari eta erantzun iezadazu bai edo ez batekin.»", nombre:"ezinegona", schop:"behartu eta desbideratu", q:"Indarrez sinplifikatzeak ez dio galderari erantzuten."},
  ],
  opp:[
   {t:"Fenomenoak baino ez ditugu ezagutzen, inoiz ez gauza bera: espazioa, denbora eta kategoriak gureak dira, ez gauzenak.", f:null},
   {t:"Arrazoia esperientziatik ateratzen denean antinomietan erortzen da: indar berberaz frogatzen ditu tesi bat eta haren kontrakoa. Horrek muga bat markatzen du.", f:null},
   {t:"Hau da, zure ustez arrazoiak dagoeneko dena daki eta mundua nahierara asma dezakegu.", f:"deformar", peso:3},
   {t:"Edo nire mugak onartzen dituzu, edo arimen eta munduen metafisika zahar eroara itzultzen zara. Ez dago besterik.", f:"dos", peso:2},
   {t:"Arrazoimen hutsaren kritika filosofiaren gailurreko obra da; nor zara zu Kanti akatsak zuzentzeko?", f:"famoso", peso:2},
   {t:"Muga horiek gabe, filosofia fanatismora eta sineskeriara itzultzen da: arriskutsua da.", f:"miedo", peso:1},
  ],
  counters:[
   {t:"Ezagutzeko ahalmena ezagutu aurretik aztertzea uretan sartu gabe igeri egiten ikasi nahi izatea da.", str:3},
   {t:"Gauza bera, objektuari berari buruz pentsatzen dudan guztia kenduta geratzen dena, ez da misterio bat: abstrakziorik hutsena da.", str:3},
   {t:"Antinomien kontraesana ez da arrazoiaren amaiera, bere motorra baizik: egiazkoa haiek gainditzen dituen osotasuna da.", str:2},
   {t:"Ez dut esaten mundua asmatzen dugunik: pentsamendua eta errealitatea ez direla horma batek banatutako bi mundu diot.", str:2},
   {t:"Edo osotasuna nik bezala pentsatzen duzu, edo eszeptiko koldar bat besterik ez zara: aukeratu.", f:"dos"},
   {t:"Kant inoiz Königsbergetik atera ez zen agure errutinazale bat zen; zer jakingo zuen bilakaeraz?", f:"persona"},
  ]},
 {nivel:["fil","hf"], claim:"Sokrates Kaliklesen aurka (Gorgias): arrazoia al du indartsuenaren legeak?",
  cpuLado:"Ordenagailua Kalikles da: izatez, indartsuak agindu eta gehiago eduki behar du; bere burua hestea ahulen kontua da.",
  tuLado:"Sokrates zara: injustizia egitea jasatea baino okerragoa da, eta neurririk gabeko bizitza ez da zoriontsua.",
  estrat:[
   {t:"«Utzi esklabo-galderatxoak egiteari eta hitz egin gizon batek bezala.»", nombre:"gizon-mespretxua", schop:"gorrotagarria den kategoria batean sartzea", q:"Gizontasun-doinua ez da argudio bat. Zer da faltsua diodanean?"},
   {t:"«Ez al zaizu lotsa ematen, zure adinean, denbora hitzekin jolasten galtzeak?»", nombre:"adinagatiko ziria", schop:"ad hominem", q:"Nire adinak ez du erabakitzen arrazoia dudan ala ez."},
   {t:"«Hau barregarria da, aspertzen nauzu; erantzun zuk, hainbeste dakizunez.»", nombre:"ezinegona", schop:"desbideratu eta behartu", q:"Aspertzeak ez du ezer errefusatzen. Itzul gaitezen galderara."},
  ],
  opp:[
   {t:"Berdintasunaren justizia ahul askok asmatu zuten indartsua beldurrez lotzeko; izatez, onenak gehiago eduki behar du.", f:null},
   {t:"Begiratu naturari: lehoiak ez du legerik errespetatzen eta estatu indartsuak ahula menderatzen du. Horrela dira gauzak, eta horrela izan behar dute.", f:"pocos", peso:1},
   {t:"Filosofia ondo dago haurrentzat; filosofatzen jarraitzen duen gizon heldu bat barregarria da eta zartako batzuk merezi ditu.", f:"persona", peso:3},
   {t:"Edo agintzen duzu eta gozatzen, edo agintzen dizute eta jasaten duzu: ez dago bizitza onik erdibidean.", f:"dos", peso:2},
   {t:"Erretorika ikasten ez baduzu eta zure galderekin jarraitzen baduzu, edonork eramango zaitu auzitara eta hilko zaitu, defendatzen jakin gabe.", f:"miedo", peso:2},
   {t:"Zure ustez utzi egin beharko genioke geure burua zapaltzen eta inoiz ez defendatzen; koldar izatea predikatzen duzu.", f:"deformar", peso:2},
  ],
  counters:[
   {t:"Indartsuena gehien dezakeena bada, eta askok batek baino gehiago badezakete, orduan askoren justizia da naturarena: zeure legeak kontra egiten dizu.", str:3},
   {t:"Neurririk gabeko arima upel zulatu bat da: bota ahala bota, inoiz ez da betetzen; bizitza hori ez da zoriona, amaierarik gabeko gabezia baizik.", str:3},
   {t:"Plazera eta mina aldi berean sentitzen dira (egarri denak plazerez edaten du oraindik egarria jasaten duen bitartean), baina ongia eta gaizkia ez; beraz, plazera ez da ongia.", str:2},
   {t:"Ez dut esaten geure burua zapaltzen utzi behar dugunik: injustizia egiteak sufritzeak baino gehiago kaltetzen duela arima diot; horregatik nahiago dut kolpea jaso, eman baino.", str:2},
   {t:"Zuk hau defendatzen duzu eskrupulurik gabeko handinahia zarelako; horregatik ez dizut sinesten.", f:"persona"},
   {t:"Edo justiziak balio duela onartzen duzu, edo tirano bat besterik ez zarela aitortzen duzu: aukeratu.", f:"dos"},
  ]},
 {nivel:["fil","hf"], claim:"Sokrates Eutifronen aurka: zer da santutasuna?",
  cpuLado:"Ordenagailua Eutifron da: erlijioan aditua dela uste duen igarle bat, bere aita salatzera doana; «santua» zer den badakiela ziurtatzen du.",
  tuLado:"Sokrates zara: ez dituzu adibideak bilatzen, definizioa baizik: ekintza santu oro santu egiten duen ezaugarria.",
  estrat:[
   {t:"«Gauza hauetaz zuk baino askoz gehiago dakit, Sokrates; zerbaitegatik naiz igarlea.»", nombre:"adituaren harrokeria", schop:"norberaren autoritatera jotzea", q:"Igarlea izateak ez dio galderari erantzuten: esadazu zer den santua."},
   {t:"«Hainbeste galderatxorekin nekatzen nauzu; hau edonork ulertzen du zuk izan ezik.»", nombre:"ezinegona", schop:"mespretxua / ad hominem", q:"Nekatzeak ez du ezer errefusatzen. Itzul gaitezen galderara."},
   {t:"«Presa dut, Sokrates, zain naukate; beste egun baterako utziko dugu.»", nombre:"ihesa", schop:"galderari itzuri egitea", q:"Joatea ez da erantzutea: ihes egiteak galdera zutik uzten du."},
  ],
  opp:[
   {t:"Zer da santua? Santua orain bertan egiten ari naizena da: krimena egiten duena jazartzea. Hor duzu.", f:null},
   {t:"Zeusek berak kateatu zuen bere aita Krono; jainkoek gauza horiek egiten badituzte, nor naiz ni haiek ez imitatzeko?", f:"famoso", peso:2},
   {t:"Argi-argi dago: santua jainkoek maite dutena da, eta santugabea haiei gorrotagarria zaiena.", f:null},
   {t:"Orduan, santua jainko GUZTIEK salbuespenik gabe maite dutena izango da; benetan jainko den batek ere ez luke krimenik maiteko.", f:"notrue", peso:2},
   {t:"Santua da jainkoek maite dutelako, eta kito; horrekin nahikoa duzu zer den jakiteko.", f:null},
   {t:"Atenas osoak ongi asko daki zer den santutasuna; zuk bakarrik egiten duzu ez ulertzenarena.", f:"todos", peso:2},
  ],
  counters:[
   {t:"ZER den santutasuna galdetu dizut, ez santua den zerbaiten adibidea. Emadazu ekintza santu oro santu egiten duen ezaugarria, edozein egintza harekin neurtzeko.", str:3},
   {t:"Jainkoak elkarren artean liskarrean badabiltza, poetek dioten bezala, gauza bera batzuek maite eta besteek gorrotatuko dute: santua eta santugabea aldi berean. Zure definizioak bere burua kontraesaten du.", str:3},
   {t:"Santua jainkoek maite dute santua DELAKO, ala santua da maite DUTELAKO? Dagoeneko santua delako maite badute, maitatua izatea ez da santu egiten duena: gertatzen zaiona esaten didazu, ez dena.", str:3},
   {t:"Jainkoekiko zure «merkataritzak» hasierara darama berriro: haiei atsegin ematea haiek maitatua izatea besterik ez da, eta hori jada errefusatu dugu. Biribilean zabiltza.", str:2},
   {t:"Bere aita auzitara eramateko gai den gizon batek ez du bihotzik; ez diot dioen ezeri sinesten.", f:"persona"},
   {t:"Edo santutasuna hemen eta orain definitzen duzu, edo santugabe bat zarela aitortzen duzu: aukeratu.", f:"dos"},
  ]},
 {nivel:["fil","hf"], claim:"Sokrates Eutidemo eta Dionisodororen aurka: hitzekin irabazteko artea",
  cpuLado:"Ordenagailua Eutidemo eta Dionisodoro anaia eristak dira: edozein gauza errefusatzeaz harro daude, besteak dioena diola ere, hitzen esanahi bikoitzarekin jolastuz.",
  tuLado:"Sokrates zara: bereizi hitz bakoitzaren esanahiak eta erakutsi terminoa errefusatzen dutela, ez gauza.",
  estrat:[
   {t:"Biek batera egiten dute barre: «Ikusten? Sokrates handiak ez daki haurren galdera bati erantzuten ere.»", nombre:"bikoteko barrea", schop:"errefusatu ordez barregarri uztea", q:"Barre egiteak ez du ezer errefusatzen. Non dago diodanaren hutsa?"},
   {t:"Txandaka estutzen zaituzte pentsatzen utzi gabe: «Erantzun orain! Bai edo ez! Azkar!»", nombre:"txandakako estutzea", schop:"gainera etortzea, bereizi ez dezazun", q:"Gainera etortzea ez da argudiatzea. Emadazu denbora esanahiak bereizteko."},
   {t:"«Berdin dio zer erantzuten duzun, berdin eroriko zara; hobe orain amore ematea.»", nombre:"garaiezinen blufa", schop:"garaiezintasun faltsuz beldurtzea", q:"Irabazteaz harro egoteak ez du frogatzen arrazoia duzuenik."},
  ],
  opp:[
   {t:"Ikasten dutenak jakintsuak ala ezjakinak dira? Jakintsuak badira, dagoeneko dakitena ikasten dute; ezjakinak badira, ezer ulertu gabe ikasten dute. Beraz, ikastea ezinezkoa da.", f:"equivoco", peso:2},
   {t:"Zerbait badakizu? Orduan jakintsua zara. Eta dakienak, badaki. Beraz, DENA dakizu, eta beti jakin izan duzu.", f:"equivoco", peso:2, interes:"Bi anaiek kobratu egiten dute arte hau irakasteagatik: zenbat eta tranpa liluragarriagoa, orduan eta ikasle gehiago ordaintzen."},
   {t:"Txakur bat duzu eta kumeen aita da? Orduan aita da eta zurea da: zure aita da. Eta zu kumeen anaia zara.", f:"equivoco", peso:2},
   {t:"Gaztea jakintsu bihurtzea nahi duzu, hau da, den hori izateari uztea; izateari uztea nahi duzu: hil dadila nahi duzu!", f:"equivoco", peso:2},
   {t:"Galdera orori bai edo ez erantzuten zaio. Erantzun bai edo ez soilik eta ikusiko duzu nola erortzen zaren; ñabardurak egitea tranpatien kontua da.", f:"dos", peso:2},

// Nivel de cada tema: cada objeto de TEMAS trae su `nivel`. Se filtra según la web por el hash del enlace (#eso/#fil/#hf; sin hash, todos).
TEMAS.forEach(t=>{ if(!t.nivel) t.nivel=["eso","fil","hf"]; });
const LEVELS=["eso","fil","hf"];
function activeLevel(){ try{ const h=(location.hash||"").replace("#","").toLowerCase(); return LEVELS.includes(h)?h:null; }catch(e){ return null; } }

const MAXT = 6;
let S=null, _seed=1;
function rnd(){ _seed=(_seed*1103515245+12345)&0x7fffffff; return _seed/0x7fffffff; }
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const app=()=>document.getElementById('app');

function freshState(ti){
  return {ti, meter:50, temple:3, lastHit:false, turno:0, thread:[], move:null, hand:null,
          fase:"turn", _oppQueue:shuffle(TEMAS[ti].opp.map((_,i)=>i)), comodines:{sabes:1, gana:1}};
}
function clamp(v){ return Math.max(0,Math.min(100,v)); }

function render(){
  if(!S || S.fase==="intro") return renderIntro();
  if(S.fase==="end") return renderEnd();
  renderGame();
}

function renderIntro(){
  app().innerHTML = `
   <div class="intro fade">
     <div class="center">
       <div class="eyebrow">Eztabaida-jokoa · elkarrizketa bat, gai bat</div>
       <h1>Eztabaidatu eta konbentzitu</h1>
       <p class="lede">Gai bat eztabaidatzen duzu ordenagailuaren aurka eta neurgailu batek erakusten du publikoa norengana ari den konbentzitzen. Txanda bakoitzean, esan berri duenaren aurrean, zure jokaldia aukeratzen duzu.</p>
     </div>
     <div class="rules">
       <div class="rule"><span class="n">A</span><p><b>Falazia seinalatu.</b> Bere argudioak tranpa egiten badu, izendatu eta hura defendatzera behartzen duzu. Tranpa bere jarreraren bihotza denean, horrek kalte handia egiten dio.</p></div>
       <div class="rule"><span class="n">B</span><p><b>Kontraargudiatu.</b> Bere jokaldia pasatzen uzten duzu eta zeure arrazoi batekin erantzuten duzu. Behar bezain sendoa bada, tranpa txiki bat zuzentzen entretenitzea baino gehiago konbentzitzen du… baina ahula bada eta bere tranpa handia bazen, hondoratu egiten zaitu. Kontuz: bere argudioek ere badute indarra; zure arrazoia berea baino ahulagoa bada, publikoa berarekin joaten da.</p></div>
       <div class="rule"><span class="n">♦</span><p><b>Patxada.</b> Errespetua galtzen dizutenean edo mina ematen dizutenean (irain bat, mehatxu bat, eraso pertsonal bat) patxada galtzen duzu, jokaldia harrapatuta ere: kolpeak berdin egiten du min. Ez da bere kabuz berreskuratzen, beraz pilatu egiten da. Zeron, onetik ateratzen zara (iraindu, amore eman edo ihes egin baino ez zaizu ateratzen); orduan gelditu eta arnasa hartu lasaitasun pixka bat berreskuratzeko.</p></div>
       <div class="rule"><span class="n">★</span><p><b>Komodinak (bakoitzetik bat partidako).</b> <b>Nola dakizu?</b> euskarria dutela itxurak egiten dituzten tranpak desegiten ditu (ospetsu bat, mundu guztia, kasu gutxi, kausa faltsu bat, tradizioa), haien izena jakin gabe ere; argudio zilegi baten aurrean kendu egiten dizu, bere arrazoiak ematen dizkizulako. <b>Zer irabazten du?</b> hitz egiten duenaren interes ezkutua azaleratzen du, baldin badu; ez badu, kendu egiten dizu: zantzurik gabe asmo txarra suposatzea pertsonari erasotzea da.</p></div>
     </div>
     <div class="center" style="font-weight:600;margin:4px 0 8px">Aukeratu partida honetako gaia:</div>
     <div class="pick">
       ${TEMAS.map((t,i)=>({t,i})).filter(({t})=>{const L=activeLevel();return !L||(t.nivel&&t.nivel.includes(L));}).map(({t,i})=>`<button class="btn" data-ti="${i}">${t.claim}<span class="sides">${t.tuLado}</span></button>`).join('')}
     </div>
   </div>`;
  app().querySelectorAll('[data-ti]').forEach(b=>b.onclick=()=>{ _seed=(Date.now()&0x7fffffff)||1; S=freshState(+b.dataset.ti); S.fase="turn"; nextTurn(true); });
}

function pushThread(side, text, nm){ S.thread.push({side, text, nm}); }

function nextTurn(first){
  if(S.turno>=MAXT){ S.fase="end"; return render(); }
  // el temple ya no se rellena solo: los golpes se acumulan y solo se recupera parando a respirar (a cero)
  // elige jugada del ordenador
  const T=TEMAS[S.ti];
  if(!first && rnd()<0.32){
    const pool = (T.estrat && T.estrat.length) ? T.estrat : ORDEN_ESTRAT.map(k=>ESTRAT[k]);
    const e = pool[Math.floor(rnd()*pool.length)];
    S.move={kind:"estrat", e, t:e.t};
  } else {
    if(!S._oppQueue.length) S._oppQueue=shuffle(TEMAS[S.ti].opp.map((_,i)=>i));
    const idx=S._oppQueue.shift();
    const m=T.opp[idx];
    S.move={kind:"arg", t:m.t, f:m.f, peso:m.peso||0, fuerza:m.fuerza, interes:m.interes};
  }
  S.lastHit = (S.move.kind==="estrat");
  pushThread("cpu", S.move.t, "Ordenagailua");
  S.fase="turn";
  render();
}

function hud(){
  const T=TEMAS[S.ti], you=S.meter, cpu=100-S.meter;
  return `<div class="hud">
      <div class="turnlbl">Esku-hartzea <b>${Math.min(S.turno+1,MAXT)}</b> / ${MAXT}</div>
      <div class="temple ${S.temple<=1?'low':''}"><div class="who">Patxada</div><div class="dots" style="color:${S.temple<=1?'var(--bad)':'var(--good)'}">${"♦".repeat(S.temple)+"♢".repeat(3-S.temple)}</div></div>
    </div>
    <div class="meter-wrap">
      <div class="meter-top"><span class="you">Zu ${you}%</span><span>Publikoaren konbentzimendua</span><span class="cpu">Ordenagailua ${cpu}%</span></div>
      <div class="meter"><div class="fill" style="width:${you}%"></div><div class="mid"></div></div>
    </div>
    <div class="theme-topic"><b>${T.claim}</b> &nbsp;·&nbsp; <span class="you-side">${T.tuLado}</span></div>`;
}

function threadHTML(){
  return `<div class="thread" id="thread">`+
    S.thread.map((m,i)=>`<div class="bubble ${m.side} ${i===S.thread.length-1 && m.side==='cpu'?'latest':''}"><div class="nm">${m.side==='cpu'?'Ordenagailua':'Zu'}</div>${m.text}</div>`).join('')+
    `</div>`;
}

function renderGame(){
  let html=hud()+threadHTML();
  if(S.fase==="turn"){
    if(S.temple<=0){
      html+=`<div class="phase-tag hot">🥵 Onetik atera zara — zerekin ateratzen zara?</div><div class="choices fade">`;
      html+=`<button class="btn btn-primary choice" id="respira">Gelditu eta arnasa hartu<small>ez duzu bero-beroan erantzuten; lasaitasuna berreskuratzen duzu</small></button>`;
      REACCIONES.forEach((r,i)=>{ html+=`<button class="btn btn-a choice" data-rx="${i}">${r.lbl}<small>${r.t}</small></button>`; });
      html+=`</div>`;
      app().innerHTML=html; scrollThread();
      document.getElementById('respira').onclick=()=>{ S.temple=1;
        showFB("mid","Garaiz gelditu zara.",`Oraingoan ez duzu lurrik irabazten, baina lasaitasuna berreskuratzen duzu. Batzuetan gauzarik argiena bero-beroan ez erantzutea da.`,{},0,()=>{ S.turno++; nextTurn(false); }); };
      app().querySelectorAll('[data-rx]').forEach(b=>b.onclick=()=>reaccion(+b.dataset.rx));
      return;
    }
    const hot=S.move.kind==="estrat";
    html+=`<div class="phase-tag ${hot?'hot':''}">${hot?'💢 Probokatzen ari zaizu — erantzun':'Zure txanda — nola erantzuten duzu?'}</div>`;
    html+=`<div class="choices fade">
       <button class="btn btn-a choice" data-act="a">${hot?'Seinalatu tranpa bat dela (ez argudio bat)':'Seinalatu falazia eta hura defendatzera behartu'}<small>${hot?'esaten diozu horrek ez diola gaiari erantzuten':'izendatzen duzu; bere jarreraren ardatza bada, kalte handia egiten diozu'}</small></button>
       <button class="btn btn-b choice" data-act="b">Kontraargudiatu zeure arrazoi batekin<small>bere jokaldia pasatzen uzten duzu eta zeurearekin jotzen duzu</small></button>
     </div>`;
    if(!S.comodines) S.comodines={sabes:1, gana:1};
    html+=comodinesHTML();
    app().innerHTML=html; scrollThread();
    app().querySelectorAll('[data-com]').forEach(b=>b.onclick=()=>usarComodin(b.dataset.com));
    app().querySelector('[data-act="a"]').onclick=()=>chooseA();
    app().querySelector('[data-act="b"]').onclick=()=>chooseB();

  } else if(S.fase==="name"){
    html+=`<div class="phase-tag">🎯 Zein falazia da? Izendatu desmuntatzeko</div><div class="choices grid-fal fade">`;
    ORDEN_FAL.forEach(k=>{ html+=`<button class="btn choice" data-fal="${k}">${FALACIAS[k].nombre}<small>${FALACIAS[k].tec}</small></button>`; });
    html+=`</div><div style="margin-top:8px"><button class="back" id="back">‹ atzera</button></div>`;
    app().innerHTML=html; scrollThread();
    app().querySelectorAll('[data-fal]').forEach(b=>b.onclick=()=>nameFal(b.dataset.fal));
    document.getElementById('back').onclick=()=>{ S.fase="turn"; render(); };

  } else if(S.fase==="counter"){
    html+=`<div class="phase-tag">⚔️ Aukeratu zure kontraargudioa</div><div class="choices fade">`;
    S.hand.forEach((c,i)=>{ const pips="●".repeat(c.f?1:c.str)+"○".repeat(3-(c.f?1:c.str));
      html+=`<button class="btn choice" data-c="${i}" style="padding:14px"><span style="font-family:var(--fdisp);font-weight:600">${c.t}</span><small><span class="pips">${pips}</span> itxurazko indarra</small></button>`; });
    html+=`</div><div style="margin-top:8px"><button class="back" id="back">‹ atzera</button></div>`;
    app().innerHTML=html; scrollThread();
    app().querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>playCounter(+b.dataset.c));
    document.getElementById('back').onclick=()=>{ S.fase="turn"; render(); };
  }
}
function scrollThread(){ const t=document.getElementById('thread'); if(t) t.scrollTop=t.scrollHeight; }

function chooseA(){
  if(S.move.kind==="estrat"){
    const e=S.move.e; S.temple=Math.max(0,S.temple-1);
    pushThread("you", `Hori ez da argudio bat: ${e.nombre} da. Erantzun iezadazu gaiari.`);
    const d=8; S.meter=clamp(S.meter+d);
    return showFB("win","Gelditu egin duzu.",`${e.nombre} seinalatu duzu amuari kosk egin beharrean. Publikoak nabaritzen du eta arrazoia ematen dizu. Hala ere, patxada puntu bat galtzen duzu: mina egin dizu.`,{q:e.q,schop:e.schop},d);
  }
  S.fase="name"; render();
}

function nameFal(k){
  const m=S.move, fa=FALACIAS[k];
  const fibra = m.f && FIBRA.has(m.f); if(fibra) S.temple=Math.max(0,S.temple-1); // te ha faltado al respeto: cuesta temple aunque la caces
  const notaFibra = fibra ? " Eta errespetu falta ere badenez, patxada puntu bat galtzen duzu harrapatu arren." : "";
  if(m.f===null){
    pushThread("you", `Hori ${fa.nombre} da.`);
    const d=-10; S.meter=clamp(S.meter+d);
    return showFB("lose","Han ez zegoen tranparik.",`Argudio zilegi bat zen, eta «${fa.nombre}» egotzi diozu. Falaziarik ez dagoen lekuan seinalatzeak gaiari ihes egiten ari zarela ematen du, eta publikoa hoztu egiten da zurekin.`,{},d);
  }
  const real=FALACIAS[m.f], alts=m.fAlt||[];
  if(k===m.f || alts.includes(k)){
    const elegida=FALACIAS[k];
    pushThread("you", `Hori ${elegida.nombre} da: ${elegida.q}`);
    const d=6+m.peso*3; S.meter=clamp(S.meter+d);
    let extra = m.peso>=3?" Bere jarrera osoaren ardatza zen: hura desmuntatzea suntsitzailea izan da.":(m.peso===1?" Tranpa txiki bat zen, baina tira, batzen du.":"");
    if(alts.length){ const todas=[m.f,...alts].map(x=>FALACIAS[x].nombre).join(" eta "); extra = ` Karta honek bi tranpa ezkutatzen ditu aldi berean (${todas}): bietako edozeinek balio du.`+extra; }
    return showFB("win","Harrapatua eta izenarekin!",`<b>${elegida.nombre}</b> <span style="color:var(--muted)">(${elegida.tec})</span> zen eta hura defendatzera behartzen duzu.${extra}${notaFibra}`,{q:elegida.q},d);
  }
  if(fibra){ pushThread("you", `Hori ${fa.nombre} da…`); const d=-3; S.meter=clamp(S.meter+d);
    return showFB("mid","Errespetu falta ikusi duzu, baina ez zen falazia hori.",`<b>${real.nombre}</b> <span style="color:var(--muted)">(${real.tec})</span> zen, ez «${fa.nombre}».${notaFibra}`,{q:real.q},d); }
  pushThread("you", `Hori ${fa.nombre} da…`);
  const d=-3; S.meter=clamp(S.meter+d);
  showFB("mid","Tranpa ikusi duzu, baina ez zen hori.",`Tranpa bazegoen, bai, baina ez «${fa.nombre}»: <b>${real.nombre}</b> <span style="color:var(--muted)">(${real.tec})</span> zen. Beste izen batekin salatzeak kendu egiten du: publikoak ikusten du ez dakizula ondo zer dagoen gaizki.`,{q:real.q},d);
}

/* ---------- Comodines (08-10-2026): «¿Cómo lo sabes?» y «¿Qué gana?», uno de cada por partida ---------- */
const SIN_PRUEBAS = new Set(["famoso","todos","pocos","causa","siempre"]); // trampas que fingen tener apoyo: se caen al pedir pruebas
function temaConInteres(){ return TEMAS[S.ti].opp.some(o=>o.interes); }
function comodinesHTML(){
  const c=S.comodines||{sabes:1,gana:1}; let h=`<div class="choices comodines fade" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:10px">`;
  h+=`<button class="btn choice" data-com="sabes" ${c.sabes?'':'disabled'}>★ Nola dakizu?<small>${c.sabes?'frogak eskatu; tranparen izena jakin gabe ere balio du':'erabilita'}</small></button>`;
  if(temaConInteres()) h+=`<button class="btn choice" data-com="gana" ${c.gana?'':'disabled'}>★ Zer irabazten du?<small>${c.gana?'interes ezkutu bat bilatu; zantzurik gabe, kendu egiten dizu':'erabilita'}</small></button>`;
  return h+`</div>`;
}
function usarComodin(k){
  const m=S.move; S.comodines[k]=0;
  if(k==="sabes"){
    pushThread("you", "Nola dakizu? Zer froga dituzu?");
    if(m.kind==="estrat"){ S.temple=Math.max(0,S.temple-1); return showFB("mid", "Hori ez zen baieztapen bat.", "Probokatzen ari zitzaizun; nola dakien galdetzeak ez dio bidea mozten, eta probokazioak mina eman dizu.", {}, 0); }
    if(m.f===null){ const d=-3; S.meter=clamp(S.meter+d); return showFB("lose", "Bazekien, bai.", "Bere arrazoiak azaltzen dizkizu eta publikoak entzun egiten dio: argudio zilegia zen. Frogak eskatzea ondo dago, baina hemen komodina xahutu duzu.", {}, d); }
    const fa=FALACIAS[m.f];
    if(FIBRA.has(m.f)) S.temple=Math.max(0,S.temple-1);
    if(SIN_PRUEBAS.has(m.f)){ const d=8; S.meter=clamp(S.meter+d); return showFB("win", "Ez zuen frogarik.", `Nola dakien galdetzen diozu eta ezin du ezer erakutsi: bere «${fa.nombre}» euskarririk gabe geratzen da. Gainera izena jartzen badiozu, gehiago batzen duzu.`, {q:fa.q}, d); }
    return showFB("mid", "Bere tranpa ez zen frogen kontua.", `«${fa.nombre}» zen: ez da frogak eskatuz konpontzen.`, {q:fa.q}, 0);
  }
  pushThread("you", "Eta zuk zer irabazten duzu nik sinesteaz?");
  if(m.kind==="arg" && m.interes){ const d=12; S.meter=clamp(S.meter+d); return showFB("win", "Interes bat zuen!", `Esaten duenak zer irabazten duen galdetzen duzu eta azaleratu egiten da: ${m.interes} Ez du frogatzen gezurra esaten duenik, baina publikoa ez da berdin fidatzen.`, {}, d); }
  if(m.kind==="estrat") S.temple=Math.max(0,S.temple-1);
  const d=-6; S.meter=clamp(S.meter+d); return showFB("lose", "Zantzurik gabe salatzen duzu.", "Ezerk ez du adierazten honekin zerbait irabazten duenik. Interesetan pentsatzea pentsamendu kritikoaren parte da, baina zantzurik gabe asmo txarra suposatzea pertsonari erasotzea da.", {}, d);
}

function chooseB(){
  const pool=shuffle(TEMAS[S.ti].counters.slice());
  // mano de 3 con al menos un contraargumento sólido
  const solidos=pool.filter(c=>!c.f), tramp=pool.filter(c=>c.f);
  S.hand=shuffle([solidos[0], solidos[1]||solidos[0], (rnd()<0.6&&tramp[0])?tramp[0]:(solidos[2]||solidos[0])]).slice(0,3);
  // asegura 3 distintas si se puede
  S.hand=[...new Set(S.hand)];
  let pi=0; while(S.hand.length<3 && pi<pool.length){ if(!S.hand.includes(pool[pi])) S.hand.push(pool[pi]); pi++; }
  S.fase="counter"; render();
}

function playCounter(i){
  const c=S.hand[i], m=S.move;
  if(m.kind==="estrat" || (m.f && FIBRA.has(m.f))) S.temple=Math.max(0,S.temple-1); // una provocación o un ataque personal te tocan la fibra aunque pases de ellos
  pushThread("you", c.t);
  if(c.f){
    const fa=FALACIAS[c.f]; const d=-10; S.meter=clamp(S.meter+d);
    return showFB("lose","Zeure kolpea bera tranposoa zen.",`<b>${fa.nombre}</b> <span style="color:var(--muted)">(${fa.tec})</span> erabiliz kontraerasotu duzu, eta ordenagailuak harrapatu egiten zaitu. Publikoak deskontatu egiten dizu.`,{q:fa.q},d);
  }
  const unchallenged = (m.kind==="arg" && m.f) ? m.peso : 0;
  // el ordenador también tiene fuerza (08-10-2026): argumento legítimo 2, trampa 1, provocación 2; un tema puede fijar «fuerza» por argumento
  const rival = m.kind==="arg" ? (m.fuerza || (m.f ? 1 : 2)) : 2;
  const d = (c.str - rival)*5 - unchallenged*4;
  S.meter=clamp(S.meter+d);
  if(unchallenged===0){
    if(d<0) return showFB("lose", "Bere argudioak pisu handiagoa zuen.", `Zure arrazoia (${c.str} indarra) berak esandakoa baino ahulagoa zen. ${m.kind==="estrat"?"Bere probokazioari jaramonik ez egitea ondo dago, baina erantzun sendoagoa behar zen.":"Ez zegoen tranparik seinalatzeko: arrazoi sendoagoa zegokion."}`,{},d);
    return showFB(d>0?"win":"mid", d>0?"Kontraargudio ona.":"Berdinketa txanda honetan.", `${c.str} indarreko arrazoi batekin erantzun duzu. ${m.kind==="estrat"?"Eta bere probokazioari jaramonik ez: dotorea.":"Bere jokaldiak ez zuen tranparik; hemen argudiatzea zegokion."}`,{},d);
  }
  if(d>0){
    const fa=FALACIAS[m.f];
    return showFB("win","Bere tranpa baino gogorrago jo duzu.",`Bere <b>${fa.nombre}</b> (tranpa txiki bat) pasatzen utzi duzu eta kontraargudio indartsu bat sartu duzu. Batzuetan komeni da zuzentzen ez entretenitzea: publikoak zure arrazoia hartzen du gogoan.`,{},d);
  }
  const fa=FALACIAS[m.f];
  return showFB("lose","Bere tranpa zutik jarraitzen zuen.",`Bere <b>${fa.nombre}</b> bere jarreraren ardatza zen eta pasatzen utzi duzu; zure kontraargudioak ez zuen horretarako ematen. Hemen hura <b>seinalatzea</b> komeniko zatekeen.`,{q:fa.q},d);
}

function reaccion(i){
  pushThread("you", REACCIONES[i].t);
  const d=-12; S.meter=clamp(S.meter+d); S.temple=1;
  showFB("lose","Onetik atera zara.",`Deseroso, ${REACCIONES[i].lbl.toLowerCase()} baino ez zaizu atera. Publikoa ordenagailuarekin joaten da. Horregatik, lehenengo gauza amuari kosk ez egitea da.`,{},d);
}

function showFB(cls, head, body, extra, delta, cont){
  extra=extra||{};
  const last=(S.turno+1>=MAXT);
  const dtxt = (typeof delta==="number" && delta!==0) ? `<div class="name">Publikoaren konbentzimendua: <span class="delta ${delta>0?'pos':'neg'}">${delta>0?'+':''}${delta}</span> → ${S.meter}%</div>`:``;
  let html=hud()+threadHTML();
  html+=`<div class="fb ${cls} fade">
     <div class="head">${cls==='win'?'✓':(cls==='lose'?'✕':'◆')} ${head}</div>
     <div class="name">${body}</div>
     ${dtxt}
     ${extra.q?`<div class="desmonta">Desmuntatzeko: <b>${extra.q}</b></div>`:``}
     ${extra.schop?`<div class="schop">Schopenhauerrek <b>${extra.schop}</b> gisa jaso zuen «Arrazoia izateko artea» liburuan.</div>`:``}
   </div>
   <div class="choices" style="margin-top:12px"><button class="btn btn-primary" id="cont">${last?'Ikusi epaia':'Eztabaidan jarraitu'}</button></div>`;
  app().innerHTML=html; scrollThread();
  document.getElementById('cont').onclick = cont || (()=>{ S.turno++; nextTurn(false); });
}

function renderEnd(){
  const you=S.meter, win=you>55, lose=you<45;
  const cls=win?'win':(lose?'lose':'tie');
  const titulo=win?'Publikoa konbentzitu duzu':(lose?'Publikoa ordenagailuarekin joan da':'Eztabaida estua, irabazle argirik gabe');
  const msg=win?'Jakin duzu noiz seinalatu tranpa bat eta noiz jo gogor arrazoi batekin, onetik atera gabe. Hori ongi eztabaidatzea da.'
    :(lose?'Tranpak sartu dizkizute, edo txandak huskerietan gastatu dituzu garrantzitsua erantzun gabe geratzen zen bitartean, edo deseroso jarri zaituzte. Begiratu neurgailua eta probatu beste bide bat.'
      :'Berdinduta egon da. Doitu noiz seinalatu falazia eta noiz kontraerasotu eta zure alde okertuko duzu.');
  app().innerHTML=`${hud()}
    <div class="intro center fade">
      <div class="eyebrow">Eztabaidaren amaiera</div>
      <div class="verdict ${cls}">publikoaren %${you}</div>
      <h2>${titulo}</h2>
      <p class="lede" style="margin-top:10px">${msg}</p>
      <div class="pick" style="margin-top:18px">
        <button class="btn btn-primary" id="again">Berriz eztabaidatu (gai hau)</button>
        <button class="btn" id="home">Beste gai bat aukeratu</button>
      </div>
    </div>`;
  document.getElementById('again').onclick=()=>{ _seed=(Date.now()&0x7fffffff)||1; const ti=S.ti; S=freshState(ti); S.fase="turn"; nextTurn(true); };
  document.getElementById('home').onclick=()=>{ S=null; renderIntro(); };
}

/* ---------- Tema claro/oscuro ---------- */
(function(){
  const root=document.documentElement, btn=document.getElementById('theme');
  let saved=null; try{saved=localStorage.getItem('dr_theme');}catch(e){}
  if(saved) root.setAttribute('data-theme',saved);
  btn.onclick=()=>{ const cur=root.getAttribute('data-theme');
    const dark=cur? cur==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
    const next=dark?'light':'dark'; root.setAttribute('data-theme',next);
    try{localStorage.setItem('dr_theme',next);}catch(e){} };
})();

/* ---------- Arranque con hot-reload ---------- */
function start(data){ if(data&&data.S){ S=data.S; if(typeof data.seed==='number') _seed=data.seed; } else { S=null; } render(); }
try{ window.claude?.hot?.snapshot && window.claude.hot.snapshot(()=>({S, seed:_seed})); }catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
