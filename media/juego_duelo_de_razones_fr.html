<style>
  /* Layout : un fil de conversation avec la jauge du public et le sang-froid en haut, et en bas tes deux coups. */

    --warn:#e2a15a; --cpu-bubble:#232a39; --paper:#20242f; --paper-line:#333a4c; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark;

  .hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}

  .turnlbl{font-size:.82rem;color:var(--muted);font-weight:600}

  .meter .fill{height:100%;background:var(--good);border-radius:999px;transition:width .5s ease}
  .meter .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--line)}

  .theme-topic{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:.9rem}

  .choice{text-align:left;line-height:1.3}

  .btn-a{border-color:var(--bad)} .btn-a:hover{background:color-mix(in srgb,var(--bad) 10%,transparent)}
  .btn-b{border-color:var(--accent)} .btn-b:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .pips{font-size:.8rem;letter-spacing:1px;color:var(--accent);font-weight:700}
  .back{background:transparent;border:none;color:var(--muted);font-weight:600;font-size:.85rem;width:auto;padding:4px 2px;cursor:pointer}

  .fb{border-radius:16px;padding:16px;margin-top:4px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
  .fb.win{border-color:var(--good);background:color-mix(in srgb,var(--good) 9%,var(--surface))}
  .fb.lose{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
  .fb.mid{border-color:var(--warn)}
  .fb .head{font-family:var(--fdisp);font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px}
  .fb.win .head{color:var(--good-ink)} .fb.lose .head{color:var(--bad-ink)} .fb.mid .head{color:var(--warn)}

  .fb .delta{font-weight:700;font-family:var(--fdisp)} .fb .delta.pos{color:var(--good)} .fb .delta.neg{color:var(--bad)}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .brand{font-family:var(--fdisp);font-weight:800}
  .brand .accent{color:var(--accent)}
  .ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:.82rem;font-weight:600;color:var(--muted);width:auto}
  .foot{margin-top:18px;text-align:center;font-size:.78rem;color:var(--muted)}

  .verdict.win{color:var(--good)} .verdict.lose{color:var(--bad)} .verdict.tie{color:var(--warn)}
</style>

  notrue: {nombre:"Redéfinir à sa convenance", tec:"« no true scotsman »", q:"Changes-tu la définition juste pour esquiver le contre-exemple&nbsp;? (Socrate a accepté la distinction… et l’a retournée.)"},
  equivoco:{nombre:"Jouer sur le double sens", tec:"équivoque / amphibologie", q:"Ce mot a deux sens&nbsp;: dans lequel l’emploies-tu&nbsp;? Si tu changes de sens en cours de route, tu n’as rien prouvé."},
};
const ORDEN_FAL = ["persona","famoso","siempre","pena","deformar","pocos","causa","dos","miedo","todos","notrue","equivoco"];
const FIBRA = new Set(["persona"]); // sophismes qui, en plus d’être un piège, sont un manque de respect : ils coûtent du sang-froid même si tu les repères

/* ---------- Stratagèmes éristiques : ils attaquent le sang-froid, pas le sujet ---------- */
const ESTRAT = {
  insulto:  {t:"«&nbsp;Tu penses vraiment ça&nbsp;? Faut être sacrément borné pour ne pas le voir. Allez, laisse tomber.&nbsp;»", nombre:"l’insulte", schop:"stratagème 38, l’« ultima ratio »", q:"Ce n’est pas une raison, c’est une insulte. Demande-lui de parler du sujet, pas de toi."},
  ira:      {t:"«&nbsp;Bien sûr, toi, tu es toujours si lent pour tout&nbsp;; normal que tu ne comprennes pas.&nbsp;»", nombre:"la provocation à la colère", schop:"stratagème 8", q:"«&nbsp;Sous l’emprise de la colère, personne ne juge bien.&nbsp;» Respire&nbsp;: ne mords pas à l’hameçon."},
  persona:  {t:"«&nbsp;Toi, tu ne connais rien à la vie, alors mieux vaut ne pas donner ton avis là-dessus.&nbsp;»", nombre:"l’attaque personnelle", schop:"ad hominem, stratagème 21", q:"Que ce soit toi qui le dises ne change rien à la qualité de l’idée."},
  categoria:{t:"«&nbsp;Ce que tu dis, c’est typique d’un facho. Seul un imbécile penserait comme ça.&nbsp;»", nombre:"l’étiquette odieuse qu’on te colle", schop:"ranger dans une catégorie détestable", q:"L’étiquette ne réfute rien. Où est la raison&nbsp;?"},

  desvio:   {t:"«&nbsp;Et toi alors&nbsp;? L’autre jour, tu as fait pareil. Parlons plutôt de ça.&nbsp;»", nombre:"le détournement et le retour contre toi", schop:"stratagèmes 18 et 29", q:"Que je me trompe ne répond pas à la question. Revenons au sujet."},

  {lbl:"L’insulter à ton tour", t:"«&nbsp;Eh bien toi, t’es encore plus bête, allez&nbsp;!&nbsp;»"},

 {nivel:["eso"], claim:"Faut-il laisser les portables hors de la classe&nbsp;?",

   {t:"Beaucoup de gens apprécient de se déconnecter un moment&nbsp;; la classe peut être cet endroit.", str:1},
   {t:"Ou bien le portable dehors, ou bien ce sera un cybercafé et personne n’apprendra rien.", f:"dos"},

 {nivel:["eso"], claim:"Est-il conseillé de manger du fast-food tous les jours&nbsp;?",
  cpuLado:"L’ordinateur défend&nbsp;: «&nbsp;oui, allez-y, tous les jours&nbsp;».",
  tuLado:"Tu défends&nbsp;: «&nbsp;de temps en temps oui, tous les jours non&nbsp;».",
  opp:[

   {t:"Toute la classe y mange le vendredi&nbsp;; il y a bien une raison.", f:"todos", peso:2},
   {t:"Mon cousin mange des hamburgers et il est super costaud&nbsp;: cette nourriture te rend fort.", f:"causa", peso:2},

 {nivel:["fil","hf"], claim:"La justice n’est-elle que l’intérêt du plus fort&nbsp;? · Socrate contre Thrasymaque",

 {nivel:["hf"], claim:"L’Atheismusstreit (1798)&nbsp;: est-il athée d’identifier Dieu à l’ordre moral du monde&nbsp;?",

  ],
  counters:[

 {nivel:["fil","hf"], claim:"Le dualisme de Descartes&nbsp;: l’esprit et le corps sont-ils deux substances ou une seule&nbsp;?",

   {t:"«&nbsp;Toi, qui te caches derrière ton ‘je pense, donc je suis’, tu n’oses pas regarder le corps en face.&nbsp;»", nombre:"la pique personnelle", schop:"ad hominem", q:"Mon caractère ne décide pas si l’esprit et le corps sont distincts."},

   {t:"D’après toi, le corps est une prison sans valeur et seule l’âme compte&nbsp;; tu méprises toute la chair.", f:"deformar", peso:3},
   {t:"Ou l’âme est une substance à part, ou tu n’es qu’une machine sans liberté&nbsp;: choisis.", f:"dos", peso:2},

  ],

 {nivel:["hf"], claim:"Hegel contre Kant&nbsp;: la raison a-t-elle des limites infranchissables ou peut-elle tout penser&nbsp;?",

   {t:"«&nbsp;Arrête de nous embrouiller avec ta ‘dialectique’ et réponds-moi par oui ou par non.&nbsp;»", nombre:"l’impatience", schop:"forcer et détourner", q:"Simplifier de force ne répond pas à la question."},

 {nivel:["fil","hf"], claim:"Socrate contre Calliclès (Gorgias)&nbsp;: la loi du plus fort a-t-elle raison&nbsp;?",

  estrat:[

   {t:"«&nbsp;Tu n’as pas honte, à ton âge, de perdre ton temps à jouer avec les mots&nbsp;?&nbsp;»", nombre:"la pique sur l’âge", schop:"ad hominem", q:"Mon âge ne décide pas si j’ai raison."},
   {t:"«&nbsp;C’est ridicule, tu m’ennuies&nbsp;; réponds toi-même, toi qui sais tant de choses.&nbsp;»", nombre:"l’impatience", schop:"détourner et forcer", q:"S’ennuyer ne réfute rien. Revenons à la question."},
  ],
  opp:[

   {t:"Regarde la nature&nbsp;: le lion ne respecte aucune loi et l’État fort s’impose au faible. Les choses sont ainsi, et elles doivent l’être.", f:"pocos", peso:1},
   {t:"La philosophie est bonne pour les enfants&nbsp;; un homme fait qui continue à philosopher est ridicule et mérite une bonne fessée.", f:"persona", peso:3},
   {t:"Ou tu commandes et tu jouis, ou on te commande et tu subis&nbsp;: il n’y a pas de bonne vie à mi-chemin.", f:"dos", peso:2},
   {t:"Si tu n’apprends pas la rhétorique et que tu continues avec tes questions, n’importe qui t’emmènera devant un tribunal et te fera condamner à mort sans que tu saches te défendre.", f:"miedo", peso:2},
   {t:"D’après toi, il faudrait se laisser piétiner et ne jamais se défendre&nbsp;; tu prêches la lâcheté.", f:"deformar", peso:2},
  ],
  counters:[
   {t:"Si le plus fort est celui qui peut le plus, et que la multitude peut plus qu’un seul, alors la justice de la multitude est celle de la nature&nbsp;: ta propre loi te contredit.", str:3},
   {t:"L’âme sans mesure est un tonneau percé&nbsp;: tu as beau verser, il ne se remplit jamais&nbsp;; cette vie n’est pas un bonheur, c’est un manque sans fin.", str:3},
   {t:"Plaisir et douleur se ressentent en même temps (l’assoiffé boit avec plaisir alors qu’il souffre encore de la soif), mais pas le bien et le mal&nbsp;; donc le plaisir n’est pas le bien.", str:2},
   {t:"Je ne dis pas de se laisser piétiner&nbsp;: je dis que commettre l’injustice nuit plus à l’âme que la subir&nbsp;; c’est pourquoi je préfère recevoir le coup que le donner.", str:2},
   {t:"Tu défends cela parce que tu es un ambitieux sans scrupules&nbsp;; c’est pourquoi je ne te crois pas.", f:"persona"},
   {t:"Ou tu admets que la justice a de la valeur, ou tu reconnais que tu n’es qu’un tyran&nbsp;: choisis.", f:"dos"},
  ]},
 {nivel:["fil","hf"], claim:"Socrate contre Euthyphron&nbsp;: qu’est-ce que la piété&nbsp;?",
  cpuLado:"L’ordinateur est Euthyphron&nbsp;: un devin qui se croit expert en religion et qui va dénoncer son propre père&nbsp;; il assure savoir ce qu’est «&nbsp;le pieux&nbsp;».",
  tuLado:"Tu es Socrate&nbsp;: tu ne cherches pas des exemples, mais la définition&nbsp;: le trait par lequel toute action pieuse est pieuse.",
  estrat:[
   {t:"«&nbsp;J’en sais bien plus que toi sur ces choses, Socrate&nbsp;; je suis devin, après tout.&nbsp;»", nombre:"la suffisance de l’expert", schop:"se prévaloir de sa propre autorité", q:"Que tu sois devin ne répond pas à la question&nbsp;: dis-moi ce qu’est le pieux."},
   {t:"«&nbsp;Tu me fatigues avec toutes tes petites questions&nbsp;; n’importe qui comprend ça, sauf toi.&nbsp;»", nombre:"l’impatience", schop:"dédain / ad hominem", q:"Te fatiguer ne réfute rien. Revenons à la question."},
   {t:"«&nbsp;Je suis pressé, Socrate, on m’attend&nbsp;; on remet ça à un autre jour.&nbsp;»", nombre:"la fuite", schop:"esquiver la question", q:"Partir, ce n’est pas répondre&nbsp;: fuir laisse la question debout."},
  ],
  opp:[
   {t:"Qu’est-ce que le pieux&nbsp;? Le pieux, c’est ce que je fais en ce moment même&nbsp;: poursuivre celui qui commet un crime. Voilà.", f:null},
   {t:"Zeus lui-même a enchaîné son père Cronos&nbsp;; si les dieux font ces choses, qui suis-je pour ne pas les imiter&nbsp;?", f:"famoso", peso:2},
   {t:"C’est évident&nbsp;: le pieux est ce qui est cher aux dieux, et l’impie ce qui leur est odieux.", f:null},
   {t:"Alors le pieux sera ce qu’aiment TOUS les dieux sans exception&nbsp;; aucun qui soit vraiment dieu n’aimerait un crime.", f:"notrue", peso:2},
   {t:"C’est pieux parce que les dieux l’aiment, point final&nbsp;; ça te suffit pour savoir ce que c’est.", f:null},
   {t:"Tout Athènes sait très bien ce qu’est la piété&nbsp;; il n’y a que toi qui fais semblant de ne pas comprendre.", f:"todos", peso:2},
  ],
  counters:[
   {t:"Je t’ai demandé CE QU’EST la piété, pas un exemple de chose pieuse. Donne-moi le trait par lequel toute action pieuse est pieuse, pour mesurer n’importe quel acte avec lui.", str:3},
   {t:"Si les dieux se disputent entre eux, comme le racontent les poètes, la même chose sera aimée des uns et haïe des autres&nbsp;: pieuse et impie à la fois. Ta définition se contredit.", str:3},
   {t:"Le pieux est-il aimé des dieux PARCE QU’il est pieux, ou est-il pieux PARCE QU’ils l’aiment&nbsp;? S’ils l’aiment parce qu’il est déjà pieux, être aimé n’est pas ce qui le rend pieux&nbsp;: tu me dis ce qui lui arrive, pas ce qu’il est.", str:3},
   {t:"Ton «&nbsp;commerce&nbsp;» avec les dieux revient au point de départ&nbsp;: leur plaire, ce n’est rien d’autre qu’être aimé d’eux, et cela, nous l’avons déjà réfuté. Tu tournes en rond.", str:2},
   {t:"Un homme capable de traîner son propre père en justice n’a pas de cœur&nbsp;; je ne me fie à rien de ce qu’il dit.", f:"persona"},
   {t:"Ou tu définis la piété ici et maintenant, ou reconnais que tu es un impie&nbsp;: choisis.", f:"dos"},
  ]},
 {nivel:["fil","hf"], claim:"Socrate contre Euthydème et Dionysodore&nbsp;: l’art de vaincre par les mots",
  cpuLado:"L’ordinateur, ce sont les frères éristes Euthydème et Dionysodore&nbsp;: ils se vantent de tout réfuter, quoi que dise l’autre, en jouant sur le double sens des mots.",
  tuLado:"Tu es Socrate&nbsp;: distingue les sens de chaque mot et montre qu’ils réfutent le terme, pas la chose.",
  estrat:[
   {t:"Ils rient en duo&nbsp;: «&nbsp;Vous voyez&nbsp;? Le grand Socrate ne sait même pas répondre à une question d’enfant.&nbsp;»", nombre:"le rire en duo", schop:"ridiculiser au lieu de réfuter", q:"Rire ne réfute rien. Où est la faille dans ce que je dis&nbsp;?"},
   {t:"Ils te harcèlent à tour de rôle sans te laisser penser&nbsp;: «&nbsp;Réponds maintenant&nbsp;! Oui ou non&nbsp;! Vite&nbsp;!&nbsp;»", nombre:"le harcèlement à tour de rôle", schop:"bousculer pour que tu ne distingues pas", q:"Bousculer n’est pas argumenter. Laisse-moi le temps de distinguer les sens."},
   {t:"«&nbsp;Peu importe ce que tu répondras, tu tomberas quand même&nbsp;; autant te rendre tout de suite.&nbsp;»", nombre:"le bluff des invincibles", schop:"intimider par une fausse invincibilité", q:"Que vous vous vantiez de gagner ne prouve pas que vous avez raison."},
  ],
  opp:[
   {t:"Ceux qui apprennent, sont-ce les sages ou les ignorants&nbsp;? Si ce sont les sages, ils apprennent ce qu’ils savent déjà&nbsp;; si ce sont les ignorants, ils apprennent sans rien comprendre. Donc apprendre est impossible.", f:"equivoco", peso:2},
   {t:"Sais-tu quelque chose&nbsp;? Alors tu es un sage. Et celui qui sait, sait. Donc tu sais TOUT, et tu l’as toujours su.", f:"equivoco", peso:2, interes:"Les deux frères se font payer pour enseigner cet art&nbsp;: plus le piège éblouit, plus il y a d’élèves payants."},
   {t:"As-tu un chien, et est-il père de chiots&nbsp;? Alors il est père et il est à toi&nbsp;: c’est ton père. Et toi, tu es le frère des chiots.", f:"equivoco", peso:2},
   {t:"Tu veux que le jeune devienne sage, c’est-à-dire qu’il cesse d’être ce qu’il est&nbsp;; tu veux qu’il cesse d’être&nbsp;: tu veux qu’il meure&nbsp;!", f:"equivoco", peso:2},
   {t:"Toute question se résout par oui ou non. Réponds seulement oui ou non et tu verras comme tu tomberas&nbsp;; nuancer, c’est de la triche.", f:"dos", peso:2},
   {t:"Tout à l’heure tu as dit une chose et maintenant une autre&nbsp;; donc tu te contredis et tu as perdu, quoi que tu dises.", f:"deformar", peso:1},
  ],
  counters:[
   {t:"Je distingue&nbsp;: «&nbsp;apprendre&nbsp;» signifie deux choses, acquérir un savoir nouveau et comprendre ce qu’on possède déjà. L’ignorant apprend au premier sens. L’équivoque dissipée, il n’y a plus de paradoxe.", str:3},
   {t:"«&nbsp;Savoir quelque chose&nbsp;» n’est pas «&nbsp;tout savoir&nbsp;»&nbsp;: de ce qu’il sache une chose, il ne s’ensuit pas qu’il les sache toutes. Tu joues sur le mot «&nbsp;savoir&nbsp;».", str:3},
   {t:"«&nbsp;Il est père&nbsp;» et «&nbsp;il est à moi&nbsp;» sont vrais séparément, mais ne s’additionnent pas&nbsp;: le chien est père de ses chiots et à moi comme animal, pas mon père. Tu confonds deux sens du verbe «&nbsp;être&nbsp;».", str:3},
   {t:"Vouloir que quelqu’un devienne sage, ce n’est pas vouloir qu’il «&nbsp;cesse d’être&nbsp;»&nbsp;: c’est vouloir qu’il reste lui-même et qu’en plus il sache. Tu réfutes un mot, pas mon souhait.", str:2},
   {t:"Seuls deux bonimenteurs de foire diraient une chose pareille&nbsp;; je ne vais pas vous prêter la moindre attention.", f:"persona"},
   {t:"Ou bien vous admettez que votre jeu n’est que du bavardage, ou bien vous êtes des charlatans&nbsp;: choisissez.", f:"dos"},
  ]},
 {nivel:["fil","hf"], claim:"Socrate contre Criton&nbsp;: faut-il s’évader face à une condamnation injuste&nbsp;?",

// Niveau de chaque sujet : chaque objet de TEMAS porte son `nivel`. On filtre selon la web par le hash du lien (#eso/#fil/#hf ; sans hash, tous).
TEMAS.forEach(t=>{ if(!t.nivel) t.nivel=["eso","fil","hf"]; });
const LEVELS=["eso","fil","hf"];
function activeLevel(){ try{ const h=(location.hash||"").replace("#","").toLowerCase(); return LEVELS.includes(h)?h:null; }catch(e){ return null; } }

const MAXT = 6;
let S=null, _seed=1;
function rnd(){ _seed=(_seed*1103515245+12345)&0x7fffffff; return _seed/0x7fffffff; }
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const app=()=>document.getElementById('app');

function freshState(ti){
  return {ti, meter:50, temple:3, lastHit:false, turno:0, thread:[], move:null, hand:null,
          fase:"turn", _oppQueue:shuffle(TEMAS[ti].opp.map((_,i)=>i)), comodines:{sabes:1, gana:1}};
}
function clamp(v){ return Math.max(0,Math.min(100,v)); }

function render(){
  if(!S || S.fase==="intro") return renderIntro();
  if(S.fase==="end") return renderEnd();
  renderGame();
}

function renderIntro(){
  app().innerHTML = `
   <div class="intro fade">
     <div class="center">
       <div class="eyebrow">Jeu de débat · une conversation, un sujet</div>
       <h1>Discute et convaincs</h1>
       <p class="lede">Tu débats d’un sujet contre l’ordinateur et une jauge indique qui le public est en train de convaincre. À chaque tour, face à ce qu’il vient de dire, tu choisis ton coup.</p>
     </div>
     <div class="rules">
       <div class="rule"><span class="n">A</span><p><b>Relever le sophisme.</b> Si son argument triche, tu le nommes et tu l’obliges à le défendre. Quand le piège est le cœur de sa position, cela lui fait très mal.</p></div>
       <div class="rule"><span class="n">B</span><p><b>Contre-argumenter.</b> Tu laisses passer son coup et tu réponds avec une raison à toi. Si elle est assez forte, elle convainc davantage que de t’attarder à corriger un petit piège… mais si elle est faible et que son piège était gros, elle te coule. Attention&nbsp;: ses arguments aussi ont de la force&nbsp;; si ta raison est plus faible que la sienne, le public part avec lui.</p></div>
       <div class="rule"><span class="n">♦</span><p><b>Sang-froid.</b> Quand on te manque de respect ou qu’on te pique au vif (une insulte, une menace, une attaque personnelle), tu perds du sang-froid, même si tu repères le coup&nbsp;: il fait mal quand même. Il ne se récupère pas tout seul, donc les pertes s’accumulent. À zéro, tu perds ton sang-froid (tu ne peux plus qu’insulter, te rendre ou fuir)&nbsp;; alors arrête-toi et respire pour retrouver un peu de calme.</p></div>
       <div class="rule"><span class="n">★</span><p><b>Jokers (un de chaque par partie).</b> <b>Comment le sais-tu&nbsp;?</b> démonte les pièges qui font semblant d’avoir un appui (une célébrité, tout le monde, peu de cas, une fausse cause, la tradition) même si tu n’en connais pas le nom&nbsp;; face à un argument légitime, il te fait perdre des points, car il te donne ses raisons. <b>Qu’y gagne-t-il&nbsp;?</b> fait apparaître l’intérêt caché de celui qui parle, s’il en a un&nbsp;; s’il n’en a pas, tu perds des points&nbsp;: présupposer de la mauvaise foi sans indices, c’est attaquer la personne.</p></div>
     </div>
     <div class="center" style="font-weight:600;margin:4px 0 8px">Choisis le sujet de cette partie&nbsp;:</div>
     <div class="pick">
       ${TEMAS.map((t,i)=>({t,i})).filter(({t})=>{const L=activeLevel();return !L||(t.nivel&&t.nivel.includes(L));}).map(({t,i})=>`<button class="btn" data-ti="${i}">${t.claim}<span class="sides">${t.tuLado}</span></button>`).join('')}
     </div>
   </div>`;
  app().querySelectorAll('[data-ti]').forEach(b=>b.onclick=()=>{ _seed=(Date.now()&0x7fffffff)||1; S=freshState(+b.dataset.ti); S.fase="turn"; nextTurn(true); });
}

function pushThread(side, text, nm){ S.thread.push({side, text, nm}); }

function nextTurn(first){
  if(S.turno>=MAXT){ S.fase="end"; return render(); }
  // le sang-froid ne se remplit plus tout seul : les coups s’accumulent et on ne le récupère qu’en s’arrêtant pour respirer (à zéro)
  // choisit le coup de l’ordinateur
  const T=TEMAS[S.ti];
  if(!first && rnd()<0.32){
    const pool = (T.estrat && T.estrat.length) ? T.estrat : ORDEN_ESTRAT.map(k=>ESTRAT[k]);
    const e = pool[Math.floor(rnd()*pool.length)];
    S.move={kind:"estrat", e, t:e.t};
  } else {
    if(!S._oppQueue.length) S._oppQueue=shuffle(TEMAS[S.ti].opp.map((_,i)=>i));
    const idx=S._oppQueue.shift();
    const m=T.opp[idx];
    S.move={kind:"arg", t:m.t, f:m.f, peso:m.peso||0, fuerza:m.fuerza, interes:m.interes};
  }
  S.lastHit = (S.move.kind==="estrat");
  pushThread("cpu", S.move.t, "Ordinateur");
  S.fase="turn";
  render();
}

function hud(){
  const T=TEMAS[S.ti], you=S.meter, cpu=100-S.meter;
  return `<div class="hud">
      <div class="turnlbl">Intervention <b>${Math.min(S.turno+1,MAXT)}</b> / ${MAXT}</div>
      <div class="temple ${S.temple<=1?'low':''}"><div class="who">Sang-froid</div><div class="dots" style="color:${S.temple<=1?'var(--bad)':'var(--good)'}">${"♦".repeat(S.temple)+"♢".repeat(3-S.temple)}</div></div>
    </div>
    <div class="meter-wrap">
      <div class="meter-top"><span class="you">Toi ${you}%</span><span>Conviction du public</span><span class="cpu">Ordinateur ${cpu}%</span></div>
      <div class="meter"><div class="fill" style="width:${you}%"></div><div class="mid"></div></div>
    </div>
    <div class="theme-topic"><b>${T.claim}</b> &nbsp;·&nbsp; <span class="you-side">${T.tuLado}</span></div>`;
}

function threadHTML(){
  return `<div class="thread" id="thread">`+
    S.thread.map((m,i)=>`<div class="bubble ${m.side} ${i===S.thread.length-1 && m.side==='cpu'?'latest':''}"><div class="nm">${m.side==='cpu'?'Ordinateur':'Toi'}</div>${m.text}</div>`).join('')+
    `</div>`;
}

function renderGame(){
  let html=hud()+threadHTML();
  if(S.fase==="turn"){
    if(S.temple<=0){
      html+=`<div class="phase-tag hot">🥵 Tu as perdu ton sang-froid — comment réagis-tu&nbsp;?</div><div class="choices fade">`;
      html+=`<button class="btn btn-primary choice" id="respira">S’arrêter et respirer<small>tu ne réponds pas à chaud&nbsp;; tu retrouves ton calme</small></button>`;
      REACCIONES.forEach((r,i)=>{ html+=`<button class="btn btn-a choice" data-rx="${i}">${r.lbl}<small>${r.t}</small></button>`; });
      html+=`</div>`;
      app().innerHTML=html; scrollThread();
      document.getElementById('respira').onclick=()=>{ S.temple=1;
        showFB("mid","Tu t’es arrêté à temps.",`Tu ne gagnes pas de terrain cette fois, mais tu retrouves ton calme. Parfois, le plus intelligent est de ne pas répondre à chaud.`,{},0,()=>{ S.turno++; nextTurn(false); }); };
      app().querySelectorAll('[data-rx]').forEach(b=>b.onclick=()=>reaccion(+b.dataset.rx));
      return;
    }
    const hot=S.move.kind==="estrat";
    html+=`<div class="phase-tag ${hot?'hot':''}">${hot?'💢 Il te provoque — réponds':'À ton tour — comment réponds-tu&nbsp;?'}</div>`;
    html+=`<div class="choices fade">
       <button class="btn btn-a choice" data-act="a">${hot?'Relever que c’est un piège (pas un argument)':'Relever le sophisme et l’obliger à le défendre'}<small>${hot?'tu lui dis que cela ne répond pas au sujet':'tu le nommes&nbsp;; si c’est l’axe de sa position, tu lui fais très mal'}</small></button>
       <button class="btn btn-b choice" data-act="b">Contre-argumenter avec une raison à toi<small>tu laisses passer son coup et tu frappes avec ce qui est à toi</small></button>
     </div>`;
    if(!S.comodines) S.comodines={sabes:1, gana:1};
    html+=comodinesHTML();
    app().innerHTML=html; scrollThread();
    app().querySelectorAll('[data-com]').forEach(b=>b.onclick=()=>usarComodin(b.dataset.com));
    app().querySelector('[data-act="a"]').onclick=()=>chooseA();
    app().querySelector('[data-act="b"]').onclick=()=>chooseB();

  } else if(S.fase==="name"){
    html+=`<div class="phase-tag">🎯 Quel est ce sophisme&nbsp;? Nomme-le pour le démonter</div><div class="choices grid-fal fade">`;
    ORDEN_FAL.forEach(k=>{ html+=`<button class="btn choice" data-fal="${k}">${FALACIAS[k].nombre}<small>${FALACIAS[k].tec}</small></button>`; });
    html+=`</div><div style="margin-top:8px"><button class="back" id="back">‹ retour</button></div>`;
    app().innerHTML=html; scrollThread();
    app().querySelectorAll('[data-fal]').forEach(b=>b.onclick=()=>nameFal(b.dataset.fal));
    document.getElementById('back').onclick=()=>{ S.fase="turn"; render(); };

  } else if(S.fase==="counter"){
    html+=`<div class="phase-tag">⚔️ Choisis ton contre-argument</div><div class="choices fade">`;
    S.hand.forEach((c,i)=>{ const pips="●".repeat(c.f?1:c.str)+"○".repeat(3-(c.f?1:c.str));
      html+=`<button class="btn choice" data-c="${i}" style="padding:14px"><span style="font-family:var(--fdisp);font-weight:600">${c.t}</span><small><span class="pips">${pips}</span> force apparente</small></button>`; });
    html+=`</div><div style="margin-top:8px"><button class="back" id="back">‹ retour</button></div>`;
    app().innerHTML=html; scrollThread();
    app().querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>playCounter(+b.dataset.c));
    document.getElementById('back').onclick=()=>{ S.fase="turn"; render(); };
  }
}
function scrollThread(){ const t=document.getElementById('thread'); if(t) t.scrollTop=t.scrollHeight; }

function chooseA(){
  if(S.move.kind==="estrat"){
    const e=S.move.e; S.temple=Math.max(0,S.temple-1);
    pushThread("you", `Ce n’est pas un argument&nbsp;: c’est ${e.nombre}. Réponds-moi sur le sujet.`);
    const d=8; S.meter=clamp(S.meter+d);
    return showFB("win","Tu lui coupes l’herbe sous le pied.",`Tu as relevé ${e.nombre} au lieu de mordre. Le public le remarque et te donne raison. Tu perds quand même un point de sang-froid&nbsp;: il t’a piqué au vif.`,{q:e.q,schop:e.schop},d);
  }
  S.fase="name"; render();
}

function nameFal(k){
  const m=S.move, fa=FALACIAS[k];
  const fibra = m.f && FIBRA.has(m.f); if(fibra) S.temple=Math.max(0,S.temple-1); // il t’a manqué de respect : ça coûte du sang-froid même si tu le repères
  const notaFibra = fibra ? " Et comme c’est en plus un manque de respect, tu perds un point de sang-froid même si tu l’as repéré." : "";
  if(m.f===null){
    pushThread("you", `C’est : ${fa.nombre}.`);
    const d=-10; S.meter=clamp(S.meter+d);
    return showFB("lose","Il n’y avait pas de piège là.",`C’était un argument légitime, et tu l’as accusé de «&nbsp;${fa.nombre}&nbsp;». Relever des sophismes là où il n’y en a pas donne l’impression que tu esquives le sujet, et le public se refroidit à ton égard.`,{},d);
  }
  const real=FALACIAS[m.f], alts=m.fAlt||[];
  if(k===m.f || alts.includes(k)){
    const elegida=FALACIAS[k];
    pushThread("you", `C’est : ${elegida.nombre}. ${elegida.q}`);
    const d=6+m.peso*3; S.meter=clamp(S.meter+d);
    let extra = m.peso>=3?" C’était l’axe de toute sa position&nbsp;: le démonter a été dévastateur.":(m.peso===1?" C’était un piège mineur, mais bon, ça rapporte.":"");
    if(alts.length){ const todas=[m.f,...alts].map(x=>FALACIAS[x].nombre).join(" et "); extra = ` Cette carte cache deux pièges à la fois (${todas})&nbsp;: l’un ou l’autre fait l’affaire.`+extra; }
    return showFB("win","Repéré et nommé&nbsp;!",`C’était <b>${elegida.nombre}</b> <span style="color:var(--muted)">(${elegida.tec})</span> et tu l’obliges à le défendre.${extra}${notaFibra}`,{q:elegida.q},d);
  }
  if(fibra){ pushThread("you", `C’est : ${fa.nombre}…`); const d=-3; S.meter=clamp(S.meter+d);
    return showFB("mid","Tu as vu le manque de respect, mais ce n’était pas ce sophisme.",`C’était <b>${real.nombre}</b> <span style="color:var(--muted)">(${real.tec})</span>, pas «&nbsp;${fa.nombre}&nbsp;».${notaFibra}`,{q:real.q},d); }
  pushThread("you", `C’est : ${fa.nombre}…`);
  const d=-3; S.meter=clamp(S.meter+d);
  showFB("mid","Tu as vu le piège, mais ce n’était pas celui-là.",`Il y avait bien un piège, mais pas «&nbsp;${fa.nombre}&nbsp;»&nbsp;: c’était <b>${real.nombre}</b> <span style="color:var(--muted)">(${real.tec})</span>. L’accuser sous un autre nom te fait perdre des points&nbsp;: le public voit que tu ne sais pas bien ce qui cloche.`,{q:real.q},d);
}

/* ---------- Jokers (08-10-2026) : « Comment le sais-tu ? » et « Qu’y gagne-t-il ? », un de chaque par partie ---------- */
const SIN_PRUEBAS = new Set(["famoso","todos","pocos","causa","siempre"]); // pièges qui font semblant d’avoir un appui : ils tombent quand on demande des preuves
function temaConInteres(){ return TEMAS[S.ti].opp.some(o=>o.interes); }
function comodinesHTML(){
  const c=S.comodines||{sabes:1,gana:1}; let h=`<div class="choices comodines fade" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:10px">`;
  h+=`<button class="btn choice" data-com="sabes" ${c.sabes?'':'disabled'}>★ Comment le sais-tu&nbsp;?<small>${c.sabes?'tu demandes des preuves&nbsp;; ça marche même si tu ne connais pas le nom du piège':'déjà utilisé'}</small></button>`;
  if(temaConInteres()) h+=`<button class="btn choice" data-com="gana" ${c.gana?'':'disabled'}>★ Qu’y gagne-t-il&nbsp;?<small>${c.gana?'tu cherches un intérêt caché&nbsp;; sans indices, tu perds des points':'déjà utilisé'}</small></button>`;
  return h+`</div>`;
}
function usarComodin(k){
  const m=S.move; S.comodines[k]=0;
  if(k==="sabes"){
    pushThread("you", "Comment le sais-tu&nbsp;? Quelles preuves as-tu&nbsp;?");
    if(m.kind==="estrat"){ S.temple=Math.max(0,S.temple-1); return showFB("mid", "Ce n’était pas une affirmation.", "Il te provoquait&nbsp;; lui demander comment il le sait ne lui coupe pas l’herbe sous le pied, et la provocation t’a piqué au vif.", {}, 0); }
    if(m.f===null){ const d=-3; S.meter=clamp(S.meter+d); return showFB("lose", "Si, il le savait.", "Il t’explique ses raisons et le public l’écoute&nbsp;: c’était un argument légitime. Demander des preuves est une bonne chose, mais ici tu as gaspillé le joker.", {}, d); }
    const fa=FALACIAS[m.f];
    if(FIBRA.has(m.f)) S.temple=Math.max(0,S.temple-1);
    if(SIN_PRUEBAS.has(m.f)){ const d=8; S.meter=clamp(S.meter+d); return showFB("win", "Il n’avait pas de preuves.", `Tu lui demandes comment il le sait et il ne peut rien montrer&nbsp;: son «&nbsp;${fa.nombre}&nbsp;» reste sans appui. Si en plus tu le nommes, tu marques davantage.`, {q:fa.q}, d); }
    return showFB("mid", "Son piège ne portait pas sur les preuves.", `C’était «&nbsp;${fa.nombre}&nbsp;»&nbsp;: demander des preuves ne le règle pas.`, {q:fa.q}, 0);
  }
  pushThread("you", "Et toi, qu’y gagnes-tu à ce que je le croie&nbsp;?");
  if(m.kind==="arg" && m.interes){ const d=12; S.meter=clamp(S.meter+d); return showFB("win", "Il avait un intérêt&nbsp;!", `Tu demandes ce que gagne celui qui le dit, et ça éclate au grand jour&nbsp;: ${m.interes} Cela ne prouve pas qu’il ment, mais le public ne lui fait plus la même confiance.`, {}, d); }
  if(m.kind==="estrat") S.temple=Math.max(0,S.temple-1);
  const d=-6; S.meter=clamp(S.meter+d); return showFB("lose", "Tu l’accuses sans indices.", "Rien n’indique qu’il y gagne quoi que ce soit. Penser aux intérêts fait partie de la pensée critique, mais présupposer de la mauvaise foi sans indices, c’est attaquer la personne.", {}, d);
}

function chooseB(){
  const pool=shuffle(TEMAS[S.ti].counters.slice());
  // main de 3 avec au moins un contre-argument solide
  const solidos=pool.filter(c=>!c.f), tramp=pool.filter(c=>c.f);
  S.hand=shuffle([solidos[0], solidos[1]||solidos[0], (rnd()<0.6&&tramp[0])?tramp[0]:(solidos[2]||solidos[0])]).slice(0,3);
  // s’assure d’avoir 3 cartes différentes si possible
  S.hand=[...new Set(S.hand)];
  let pi=0; while(S.hand.length<3 && pi<pool.length){ if(!S.hand.includes(pool[pi])) S.hand.push(pool[pi]); pi++; }
  S.fase="counter"; render();
}

function playCounter(i){
  const c=S.hand[i], m=S.move;
  if(m.kind==="estrat" || (m.f && FIBRA.has(m.f))) S.temple=Math.max(0,S.temple-1); // une provocation ou une attaque personnelle te piquent au vif même si tu les ignores
  pushThread("you", c.t);
  if(c.f){
    const fa=FALACIAS[c.f]; const d=-10; S.meter=clamp(S.meter+d);
    return showFB("lose","Ton propre coup était piégé.",`Tu as contre-attaqué avec <b>${fa.nombre}</b> <span style="color:var(--muted)">(${fa.tec})</span>, et l’ordinateur te repère. Le public te le retire.`,{q:fa.q},d);
  }
  const unchallenged = (m.kind==="arg" && m.f) ? m.peso : 0;
  // l’ordinateur a aussi de la force (08-10-2026) : argument légitime 2, piège 1, provocation 2 ; un sujet peut fixer la « fuerza » par argument
  const rival = m.kind==="arg" ? (m.fuerza || (m.f ? 1 : 2)) : 2;
  const d = (c.str - rival)*5 - unchallenged*4;
  S.meter=clamp(S.meter+d);
  if(unchallenged===0){
    if(d<0) return showFB("lose", "Son argument pesait plus lourd.", `Ta raison (force ${c.str}) était plus faible que ce qu’il avait dit. ${m.kind==="estrat"?"Ignorer sa provocation est une bonne chose, mais il fallait une réponse plus solide.":"Il n’y avait pas de piège à relever&nbsp;: il fallait une raison plus forte."}`,{},d);
    return showFB(d>0?"win":"mid", d>0?"Bon contre-argument.":"Égalité sur ce tour.", `Tu as répondu avec une raison de force ${c.str}. ${m.kind==="estrat"?"Et tu as ignoré sa provocation&nbsp;: élégant.":"Son coup n’avait pas de piège&nbsp;; ici, il fallait argumenter."}`,{},d);
  }
  if(d>0){
    const fa=FALACIAS[m.f];
    return showFB("win","Tu as frappé plus fort que son piège.",`Tu as laissé passer son <b>${fa.nombre}</b> (un piège mineur) et tu as placé un contre-argument puissant. Parfois, mieux vaut ne pas s’attarder à corriger&nbsp;: le public retient ta raison.`,{},d);
  }
  const fa=FALACIAS[m.f];
  return showFB("lose","Son piège tenait toujours.",`Son <b>${fa.nombre}</b> était l’axe de sa position et tu l’as laissé passer&nbsp;; ton contre-argument ne suffisait pas. Ici, il aurait fallu le <b>relever</b>.`,{q:fa.q},d);
}

function reaccion(i){
  pushThread("you", REACCIONES[i].t);
  const d=-12; S.meter=clamp(S.meter+d); S.temple=1;
  showFB("lose","Tu as perdu tes moyens.",`Pris au dépourvu, tu as eu un seul réflexe&nbsp;: ${REACCIONES[i].lbl.toLowerCase()}. Le public part avec l’ordinateur. C’est pourquoi la première règle est de ne pas mordre à l’hameçon.`,{},d);
}

function showFB(cls, head, body, extra, delta, cont){
  extra=extra||{};
  const last=(S.turno+1>=MAXT);
  const dtxt = (typeof delta==="number" && delta!==0) ? `<div class="name">Conviction du public&nbsp;: <span class="delta ${delta>0?'pos':'neg'}">${delta>0?'+':''}${delta}</span> → ${S.meter}%</div>`:``;
  let html=hud()+threadHTML();
  html+=`<div class="fb ${cls} fade">
     <div class="head">${cls==='win'?'✓':(cls==='lose'?'✕':'◆')} ${head}</div>
     <div class="name">${body}</div>
     ${dtxt}
     ${extra.q?`<div class="desmonta">Pour le démonter&nbsp;: <b>${extra.q}</b></div>`:``}
     ${extra.schop?`<div class="schop">Schopenhauer l’a recensé sous le nom de <b>${extra.schop}</b> dans «&nbsp;L’Art d’avoir toujours raison&nbsp;».</div>`:``}
   </div>
   <div class="choices" style="margin-top:12px"><button class="btn btn-primary" id="cont">${last?'Voir le verdict':'Poursuivre le débat'}</button></div>`;
  app().innerHTML=html; scrollThread();
  document.getElementById('cont').onclick = cont || (()=>{ S.turno++; nextTurn(false); });
}

function renderEnd(){
  const you=S.meter, win=you>55, lose=you<45;
  const cls=win?'win':(lose?'lose':'tie');
  const titulo=win?'Tu as convaincu le public':(lose?'Le public est parti avec l’ordinateur':'Débat serré, sans vainqueur net');
  const msg=win?'Tu as su quand relever un piège et quand frapper fort avec une raison, sans perdre ton sang-froid. Voilà ce que c’est que bien discuter.'
    :(lose?'On t’a glissé des pièges, ou tu as gaspillé des tours sur des broutilles pendant que l’essentiel restait sans réponse, ou on t’a déstabilisé. Regarde la jauge et essaie une autre ligne.'
      :'C’était serré. Affine le moment où relever le sophisme et celui où contre-attaquer, et tu feras pencher la balance de ton côté.');
  app().innerHTML=`${hud()}
    <div class="intro center fade">
      <div class="eyebrow">Fin du débat</div>
      <div class="verdict ${cls}">${you}% du public</div>
      <h2>${titulo}</h2>
      <p class="lede" style="margin-top:10px">${msg}</p>
      <div class="pick" style="margin-top:18px">
        <button class="btn btn-primary" id="again">Débattre à nouveau (ce sujet)</button>
        <button class="btn" id="home">Choisir un autre sujet</button>
      </div>
    </div>`;
  document.getElementById('again').onclick=()=>{ _seed=(Date.now()&0x7fffffff)||1; const ti=S.ti; S=freshState(ti); S.fase="turn"; nextTurn(true); };
  document.getElementById('home').onclick=()=>{ S=null; renderIntro(); };
}

/* ---------- Thème clair/sombre ---------- */
(function(){
  const root=document.documentElement, btn=document.getElementById('theme');
  let saved=null; try{saved=localStorage.getItem('dr_theme');}catch(e){}
  if(saved) root.setAttribute('data-theme',saved);
  btn.onclick=()=>{ const cur=root.getAttribute('data-theme');
    const dark=cur? cur==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
    const next=dark?'light':'dark'; root.setAttribute('data-theme',next);
    try{localStorage.setItem('dr_theme',next);}catch(e){} };
})();

/* ---------- Démarrage avec hot-reload ---------- */
function start(data){ if(data&&data.S){ S=data.S; if(typeof data.seed==='number') _seed=data.seed; } else { S=null; } render(); }
try{ window.claude?.hot?.snapshot && window.claude.hot.snapshot(()=>({S, seed:_seed})); }catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
