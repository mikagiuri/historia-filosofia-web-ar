<body style="margin:0">
<title>Duel of Reasons</title>
<meta name="description" content="A Critical Thinking debate game: a conversation on a topic in which you decide whether to call out your opponent’s fallacy or hit back with a stronger reason, without losing your composure.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Spline+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: a conversation thread with the audience meter and composure at the top, and your two moves below. */
  :root{

    --line:#2d3446; --accent:#8a97f5; --good:#4cc3a3; --good-ink:#b8f0e2; --bad:#f08478; --bad-ink:#ffd6cf;
    --warn:#e2a15a; --cpu-bubble:#232a39; --paper:#20242f; --paper-line:#333a4c; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#11141c; --surface:#1a1f2b; --surface-2:#222838; --ink:#e9ebf2; --muted:#9aa2b5;
    --line:#2d3446; --accent:#8a97f5; --good:#4cc3a3; --good-ink:#b8f0e2; --bad:#f08478; --bad-ink:#ffd6cf;
    --warn:#e2a15a; --cpu-bubble:#232a39; --paper:#20242f; --paper-line:#333a4c; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--fbody);line-height:1.5;margin:0}

  .lede{color:var(--muted);font-size:1.02rem;max-width:56ch;margin:0 auto}
  .rules{display:grid;gap:10px;margin:22px 0;text-align:left}
  .rule{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .rule .n{font-family:var(--fdisp);font-weight:800;color:var(--accent);font-size:1.3rem;line-height:1;min-width:1.2em}

  .pick{display:grid;gap:10px;margin-top:6px;text-align:left}

  .pick .sides{display:block;color:var(--muted);font-weight:500;font-size:.82rem;margin-top:3px}

  .hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .temple{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;text-align:center;min-width:92px}

  .turnlbl{font-size:.82rem;color:var(--muted);font-weight:600}
  .turnlbl b{color:var(--ink);font-family:var(--fdisp)}

  .meter-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
  .meter-top{display:flex;justify-content:space-between;font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:6px}
  .meter-top .you{color:var(--good)} .meter-top .cpu{color:var(--bad)}
  .meter{height:12px;border-radius:999px;background:color-mix(in srgb,var(--bad) 35%,var(--surface-2));overflow:hidden;position:relative}
  .meter .fill{height:100%;background:var(--good);border-radius:999px;transition:width .5s ease}
  .meter .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--line)}

  .theme-topic{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:.9rem}

  .bubble.cpu .nm{color:var(--bad)}

  .choice{text-align:left;line-height:1.3}
  .choice small{display:block;color:var(--muted);font-weight:500;font-size:.82rem;margin-top:3px}
  .grid-fal{grid-template-columns:1fr 1fr}
  @media (max-width:470px){.grid-fal{grid-template-columns:1fr}}
  .btn-a{border-color:var(--bad)} .btn-a:hover{background:color-mix(in srgb,var(--bad) 10%,transparent)}
  .btn-b{border-color:var(--accent)} .btn-b:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .pips{font-size:.8rem;letter-spacing:1px;color:var(--accent);font-weight:700}
  .back{background:transparent;border:none;color:var(--muted);font-weight:600;font-size:.85rem;width:auto;padding:4px 2px;cursor:pointer}

  .fb{border-radius:16px;padding:16px;margin-top:4px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
  .fb.win{border-color:var(--good);background:color-mix(in srgb,var(--good) 9%,var(--surface))}
  .fb.lose{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
  .fb.mid{border-color:var(--warn)}
  .fb .head{font-family:var(--fdisp);font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px}
  .fb.win .head{color:var(--good-ink)} .fb.lose .head{color:var(--bad-ink)} .fb.mid .head{color:var(--warn)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fb.win .head{color:var(--good)} :root:not([data-theme="light"]) .fb.lose .head{color:var(--bad)}}
  :root[data-theme="dark"] .fb.win .head{color:var(--good)} :root[data-theme="dark"] .fb.lose .head{color:var(--bad)}
  .fb .name{margin-top:7px}
  .fb .desmonta{margin-top:8px;font-size:.92rem;background:var(--surface-2);border-radius:10px;padding:9px 12px}
  .fb .desmonta b{color:var(--accent)}
  .fb .schop{margin-top:8px;font-size:.82rem;color:var(--muted)} .fb .schop b{color:var(--warn)}
  .fb .delta{font-weight:700;font-family:var(--fdisp)} .fb .delta.pos{color:var(--good)} .fb .delta.neg{color:var(--bad)}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .brand{font-family:var(--fdisp);font-weight:800}
  .brand .accent{color:var(--accent)}
  .ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:.82rem;font-weight:600;color:var(--muted);width:auto}
  .foot{margin-top:18px;text-align:center;font-size:.78rem;color:var(--muted)}

  .verdict{font-family:var(--fdisp);font-weight:800;font-size:2rem;margin:6px 0}
  .verdict.win{color:var(--good)} .verdict.lose{color:var(--bad)} .verdict.tie{color:var(--warn)}
</style>

<div class="wrap">
  <div class="topbar">
    <div class="brand">Duel of <span class="accent">Reasons</span></div>

  </div>
  <div id="app"></div>
  <div class="foot">Critical Thinking · 2nd ESO · IES Martín de Bertendona. The winner isn’t always the one who spots the trick: sometimes it’s the one who hits hardest with reasons.</div>

<script>
/* ---------- The 12 fallacies ---------- */
const FALACIAS = {
  persona:{nombre:"Attacking the person", tec:"ad hominem", q:"What does what the person is like have to do with whether their idea is good?"},
  famoso: {nombre:"A famous person says so", tec:"false authority", q:"Are they a real expert on THIS, or just famous?"},
  siempre:{nombre:"It’s always been done this way", tec:"appeal to tradition", q:"Does being age-old make it good?"},
  pena:   {nombre:"Pity instead of reasons", tec:"appeal to pity", q:"Are they giving me a reason, or just trying to make me feel sorry for them?"},
  deformar:{nombre:"Twisting what you said", tec:"straw man", q:"Did I really say that, or did they exaggerate it so they could attack it?"},
  pocos:  {nombre:"A few cases, a conclusion about all", tec:"hasty generalisation", q:"How many cases? Does it really hold for everyone?"},
  causa:  {nombre:"It came after, so it was the cause", tec:"false cause", q:"Is there proof that one causes the other, or do they just come one after the other?"},
  dos:    {nombre:"There are only two options", tec:"false dilemma", q:"Are you sure there isn’t a single other option?"},
  miedo:  {nombre:"Scaring you into agreeing", tec:"appeal to fear", q:"Are they giving me a reason, or just frightening me?"},
  todos:  {nombre:"Everybody says so", tec:"ad populum", q:"Does the fact that lots of people do it make it true?"},
  notrue: {nombre:"Redefining to suit yourself", tec:"‘no true Scotsman’", q:"Are you changing the definition just to dodge the counterexample? (Socrates accepted the distinction… and turned it around.)"},
  equivoco:{nombre:"Playing on a double meaning", tec:"equivocation / amphiboly", q:"That word has two senses: which one are you using? If you switch senses halfway, you haven’t proved anything."},
};
const ORDEN_FAL = ["persona","famoso","siempre","pena","deformar","pocos","causa","dos","miedo","todos","notrue","equivoco"];
const FIBRA = new Set(["persona"]); // fallacies that, besides being a trick, are disrespectful: they cost composure even if you catch them

/* ---------- Eristic stratagems: they attack your composure, not the topic ---------- */
const ESTRAT = {
  insulto:  {t:"“Seriously, you think that? You’d have to be pretty dim not to see it. Just drop it.”", nombre:"an insult", schop:"stratagem 38, the ‘last resort’", q:"That’s not a reason, it’s an insult. Ask them to talk about the topic, not about you."},
  ira:      {t:"“Of course, you’re always so slow at everything; no wonder you don’t get it.”", nombre:"provoking your anger", schop:"stratagem 8", q:"‘When angry, no one judges well.’ Breathe: don’t take the bait."},
  persona:  {t:"“You have no idea about life, so you’d better not weigh in on this.”", nombre:"a personal attack", schop:"ad hominem, stratagem 21", q:"Who is saying it doesn’t change whether the idea is good or bad."},
  categoria:{t:"“That’s typical of a fascist. Only a loser would think like that.”", nombre:"stuffing you into a hateful category", schop:"subsuming under a hateful category", q:"A label refutes nothing. Where is the reason?"},
  miedo:    {t:"“If you keep contradicting me, you’ll end up with no friends.”", nombre:"a threat", schop:"appeal to fear (ad baculum)", q:"Fear is not a reason. Why would what they say be true?"},
  desvio:   {t:"“What about you? The other day you did the same thing. Let’s talk about that instead.”", nombre:"changing the subject and pointing at you", schop:"stratagems 18 and 29", q:"Me slipping up doesn’t answer the question. Let’s get back to the topic."},
  autoridad:{t:"“A Nobel Prize winner said it and it’s been proven. End of discussion.”", nombre:"authority used to silence you", schop:"stratagem 30", q:"Who, where and why? A quotation without a reason doesn’t close the topic."},
};
const ORDEN_ESTRAT = Object.keys(ESTRAT);
const REACCIONES = [
  {lbl:"Insult them back", t:"“Well, you’re even dumber, come on!”"},
  {lbl:"Give in and agree with them", t:"“Fine, fine… whatever you say.”"},
  {lbl:"Run away from the topic", t:"“I’m out, let’s talk about something else.”"},
];

/* ---------- Debate topics. The computer defends one position; you take the opposite. ----------
   opp: the computer’s arguments. f=null is clean; with f it is a fallacy, and peso (1-3) = how much its position leans on that trick.
   counters: your counterarguments. str (1-3) = strength; with f it is a tricky counterargument that will backfire on you. */
const TEMAS = [
 {nivel:["eso"], claim:"Should phones be kept out of class?",
  cpuLado:"The computer defends: ‘let them be used freely in class’.",
  tuLado:"You defend: ‘better outside the classroom’.",
  opp:[
   {t:"A phone gives you a dictionary and a calculator instantly; used well, it is a study tool.", f:null},
   {t:"A tech guru said so in a talk: banning phones is for digital illiterates.", f:"famoso", peso:1, interes:"That guru advises a company that sells tablets and apps to schools."},
   {t:"They’re already used in every modern school; falling behind is for backwaters.", f:"todos", peso:2},

   {t:"Lots of people are glad to switch off for a while; the classroom can be that place.", str:1},
   {t:"Either phones out, or this will be an internet café and nobody will learn anything.", f:"dos"},
   {t:"My uncle says so, and he’s been a teacher for 30 years, so phones out and that’s that.", f:"famoso"},
  ]},
 {nivel:["eso"], claim:"Is it a good idea to eat fast food every day?",
  cpuLado:"The computer defends: ‘yes, go for it, every day’.",
  tuLado:"You defend: ‘now and then, yes; every day, no’.",

   {t:"It’s cheap and quick; for someone short of time, it solves lunch.", f:null},
   {t:"The most famous footballer in the world advertises it, so it can’t be that bad.", f:"famoso", peso:1, interes:"The footballer is paid millions to advertise that fast-food chain."},
   {t:"The whole class eats there on Fridays; there must be a reason.", f:"todos", peso:2},

   {t:"There are sandwiches and fruit that are just as quick and cheaper.", str:1},
   {t:"I know someone who got ill eating that; so everyone who eats it gets ill.", f:"pocos"},
   {t:"If you keep eating that, you’ll definitely end up in hospital.", f:"miedo"},

 {nivel:["eso"], claim:"Should we adopt a pet today?",
  cpuLado:"The computer defends: ‘yes, today’.",
  tuLado:"You defend: ‘prepare properly first, not today on a whim’.",
  opp:[
   {t:"There are animals at the shelter that need a home as soon as possible; waiting costs them too.", f:null},
   {t:"Look at that little face; if we don’t bring him home today I’m going to be so sad.", f:"pena", peso:2},
   {t:"My family has always had a dog, so we have to get one now.", f:"siempre", peso:1},
   {t:"All my friends have a pet; I’m the only one who doesn’t.", f:"todos", peso:1},
   {t:"Either we adopt him today, or we’ll never have a pet.", f:"dos", peso:3},

  ],
  counters:[
   {t:"A dog lives ten or fifteen years, and every day it needs feeding, walking and vet bills: it has to be organised beforehand.", str:3},

   {t:"If we bring it home with no plan and then can’t look after it, the animal is the one who suffers most.", str:2},
   {t:"A week to get the house and the schedule ready isn’t that much.", str:1},
   {t:"So according to you, animals don’t matter at all.", f:"deformar"},
   {t:"An influencer vet said the sooner the better, so today.", f:"famoso"},
  ]},
 {nivel:["fil","hf"], claim:"Is justice just the interest of the stronger? · Socrates vs. Thrasymachus",
  cpuLado:"The computer is Thrasymachus: being unjust pays better and makes you happier; justice only serves the powerful.",
  tuLado:"You are Socrates: justice is a virtue that benefits whoever has it, and the just life is happier.",

   {t:"He bursts in like a wild beast: “What a load of nonsense you’ve been spouting all this time!”", nombre:"the brutish entrance", schop:"intimidating before arguing", q:"Tone is not an argument. What does he have to say about the topic?"},
   {t:"He lets out a guffaw: “There’s Socrates’ usual irony; I knew you’d slip away.”", nombre:"mockery", schop:"ridiculing instead of refuting", q:"Laughing refutes nothing. Ask him for the reason."},

// Level of each topic: each TEMAS object carries its `nivel`. It is filtered per website by the link hash (#eso/#fil/#hf; no hash, all).
TEMAS.forEach(t=>{ if(!t.nivel) t.nivel=["eso","fil","hf"]; });
const LEVELS=["eso","fil","hf"];
function activeLevel(){ try{ const h=(location.hash||"").replace("#","").toLowerCase(); return LEVELS.includes(h)?h:null; }catch(e){ return null; } }

const MAXT = 6;
let S=null, _seed=1;
function rnd(){ _seed=(_seed*1103515245+12345)&0x7fffffff; return _seed/0x7fffffff; }
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const app=()=>document.getElementById('app');

function freshState(ti){
  return {ti, meter:50, temple:3, lastHit:false, turno:0, thread:[], move:null, hand:null,
          fase:"turn", _oppQueue:shuffle(TEMAS[ti].opp.map((_,i)=>i)), comodines:{sabes:1, gana:1}};
}
function clamp(v){ return Math.max(0,Math.min(100,v)); }

function render(){
  if(!S || S.fase==="intro") return renderIntro();
  if(S.fase==="end") return renderEnd();
  renderGame();
}

function renderIntro(){
  app().innerHTML = `
   <div class="intro fade">
     <div class="center">
       <div class="eyebrow">Debate game · one conversation, one topic</div>
       <h1>Argue and persuade</h1>
       <p class="lede">You debate a topic against the computer, and a meter shows which side the audience is coming round to. On each turn, faced with what it has just said, you choose your move.</p>
     </div>
     <div class="rules">
       <div class="rule"><span class="n">A</span><p><b>Call out the fallacy.</b> If its argument cheats, you name the trick and force it to defend it. When the trick is the heart of its position, this hurts it badly.</p></div>
       <div class="rule"><span class="n">B</span><p><b>Counterargue.</b> You let its move pass and answer with a reason of your own. If it is strong enough, it persuades more than wasting time correcting a minor trick… but if it is weak and its trick was a big one, it sinks you. Careful: its arguments have strength too; if your reason is weaker than its, the audience goes over to it.</p></div>
       <div class="rule"><span class="n">♦</span><p><b>Composure.</b> When you are disrespected or someone hits a nerve (an insult, a threat, a personal attack) you lose composure, even if you catch the move: the blow hurts all the same. It does not recover by itself, so it builds up. At zero you lose your cool (all you can do is insult, give in or run away); then stop and breathe to regain some calm.</p></div>
       <div class="rule"><span class="n">★</span><p><b>Wildcards (one of each per game).</b> <b>How do you know?</b> dismantles the tricks that pretend to have support (a famous person, everybody, a few cases, a false cause, tradition) even if you don’t know the trick’s name; against a legitimate argument it costs you, because it gives you its reasons. <b>What’s in it for them?</b> brings to light the speaker’s hidden interest, if there is one; if there isn’t, it costs you: assuming bad faith without evidence is attacking the person.</p></div>
     </div>
     <div class="center" style="font-weight:600;margin:4px 0 8px">Choose the topic for this game:</div>
     <div class="pick">
       ${TEMAS.map((t,i)=>({t,i})).filter(({t})=>{const L=activeLevel();return !L||(t.nivel&&t.nivel.includes(L));}).map(({t,i})=>`<button class="btn" data-ti="${i}">${t.claim}<span class="sides">${t.tuLado}</span></button>`).join('')}
     </div>
   </div>`;
  app().querySelectorAll('[data-ti]').forEach(b=>b.onclick=()=>{ _seed=(Date.now()&0x7fffffff)||1; S=freshState(+b.dataset.ti); S.fase="turn"; nextTurn(true); });
}

function pushThread(side, text, nm){ S.thread.push({side, text, nm}); }

function nextTurn(first){
  if(S.turno>=MAXT){ S.fase="end"; return render(); }
  // composure no longer refills by itself: blows accumulate and it is only recovered by stopping to breathe (at zero)
  // pick the computer’s move
  const T=TEMAS[S.ti];
  if(!first && rnd()<0.32){
    const pool = (T.estrat && T.estrat.length) ? T.estrat : ORDEN_ESTRAT.map(k=>ESTRAT[k]);
    const e = pool[Math.floor(rnd()*pool.length)];
    S.move={kind:"estrat", e, t:e.t};
  } else {
    if(!S._oppQueue.length) S._oppQueue=shuffle(TEMAS[S.ti].opp.map((_,i)=>i));
    const idx=S._oppQueue.shift();
    const m=T.opp[idx];
    S.move={kind:"arg", t:m.t, f:m.f, peso:m.peso||0, fuerza:m.fuerza, interes:m.interes};
  }
  S.lastHit = (S.move.kind==="estrat");
  pushThread("cpu", S.move.t, "Computer");
  S.fase="turn";
  render();
}

function hud(){
  const T=TEMAS[S.ti], you=S.meter, cpu=100-S.meter;
  return `<div class="hud">
      <div class="turnlbl">Turn <b>${Math.min(S.turno+1,MAXT)}</b> / ${MAXT}</div>
      <div class="temple ${S.temple<=1?'low':''}"><div class="who">Composure</div><div class="dots" style="color:${S.temple<=1?'var(--bad)':'var(--good)'}">${"♦".repeat(S.temple)+"♢".repeat(3-S.temple)}</div></div>
    </div>
    <div class="meter-wrap">
      <div class="meter-top"><span class="you">You ${you}%</span><span>Audience conviction</span><span class="cpu">Computer ${cpu}%</span></div>
      <div class="meter"><div class="fill" style="width:${you}%"></div><div class="mid"></div></div>
    </div>
    <div class="theme-topic"><b>${T.claim}</b> &nbsp;·&nbsp; <span class="you-side">${T.tuLado}</span></div>`;
}

function threadHTML(){
  return `<div class="thread" id="thread">`+
    S.thread.map((m,i)=>`<div class="bubble ${m.side} ${i===S.thread.length-1 && m.side==='cpu'?'latest':''}"><div class="nm">${m.side==='cpu'?'Computer':'You'}</div>${m.text}</div>`).join('')+
    `</div>`;
}

function renderGame(){
  let html=hud()+threadHTML();
  if(S.fase==="turn"){
    if(S.temple<=0){
      html+=`<div class="phase-tag hot">🥵 You’ve lost your cool — what do you come out with?</div><div class="choices fade">`;
      html+=`<button class="btn btn-primary choice" id="respira">Stop and breathe<small>you don’t answer in the heat of the moment; you regain your calm</small></button>`;
      REACCIONES.forEach((r,i)=>{ html+=`<button class="btn btn-a choice" data-rx="${i}">${r.lbl}<small>${r.t}</small></button>`; });
      html+=`</div>`;
      app().innerHTML=html; scrollThread();
      document.getElementById('respira').onclick=()=>{ S.temple=1;
        showFB("mid","You stopped in time.",`You don’t gain ground this time, but you regain your calm. Sometimes the smartest thing is not to answer in the heat of the moment.`,{},0,()=>{ S.turno++; nextTurn(false); }); };
      app().querySelectorAll('[data-rx]').forEach(b=>b.onclick=()=>reaccion(+b.dataset.rx));
      return;
    }
    const hot=S.move.kind==="estrat";
    html+=`<div class="phase-tag ${hot?'hot':''}">${hot?'💢 It’s provoking you — respond':'Your turn — how do you respond?'}</div>`;
    html+=`<div class="choices fade">
       <button class="btn btn-a choice" data-act="a">${hot?'Point out that it’s a trick (not an argument)':'Call out the fallacy and force it to defend it'}<small>${hot?'you tell it that this does not answer the topic':'you name it; if it is the core of its position, you hurt it badly'}</small></button>
       <button class="btn btn-b choice" data-act="b">Counterargue with a reason of your own<small>you let its move pass and hit back with your own point</small></button>
     </div>`;
    if(!S.comodines) S.comodines={sabes:1, gana:1};
    html+=comodinesHTML();
    app().innerHTML=html; scrollThread();
    app().querySelectorAll('[data-com]').forEach(b=>b.onclick=()=>usarComodin(b.dataset.com));
    app().querySelector('[data-act="a"]').onclick=()=>chooseA();
    app().querySelector('[data-act="b"]').onclick=()=>chooseB();

  } else if(S.fase==="name"){
    html+=`<div class="phase-tag">🎯 Which fallacy is it? Name it to dismantle it</div><div class="choices grid-fal fade">`;
    ORDEN_FAL.forEach(k=>{ html+=`<button class="btn choice" data-fal="${k}">${FALACIAS[k].nombre}<small>${FALACIAS[k].tec}</small></button>`; });
    html+=`</div><div style="margin-top:8px"><button class="back" id="back">‹ back</button></div>`;
    app().innerHTML=html; scrollThread();
    app().querySelectorAll('[data-fal]').forEach(b=>b.onclick=()=>nameFal(b.dataset.fal));
    document.getElementById('back').onclick=()=>{ S.fase="turn"; render(); };

  } else if(S.fase==="counter"){
    html+=`<div class="phase-tag">⚔️ Choose your counterargument</div><div class="choices fade">`;
    S.hand.forEach((c,i)=>{ const pips="●".repeat(c.f?1:c.str)+"○".repeat(3-(c.f?1:c.str));
      html+=`<button class="btn choice" data-c="${i}" style="padding:14px"><span style="font-family:var(--fdisp);font-weight:600">${c.t}</span><small><span class="pips">${pips}</span> apparent strength</small></button>`; });
    html+=`</div><div style="margin-top:8px"><button class="back" id="back">‹ back</button></div>`;
    app().innerHTML=html; scrollThread();
    app().querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>playCounter(+b.dataset.c));
    document.getElementById('back').onclick=()=>{ S.fase="turn"; render(); };
  }
}
function scrollThread(){ const t=document.getElementById('thread'); if(t) t.scrollTop=t.scrollHeight; }

function chooseA(){
  if(S.move.kind==="estrat"){
    const e=S.move.e; S.temple=Math.max(0,S.temple-1);
    pushThread("you", `That’s not an argument: it’s ${e.nombre}. Answer me on the topic.`);
    const d=8; S.meter=clamp(S.meter+d);
    return showFB("win","You stop it in its tracks.",`You called out ${e.nombre} instead of taking the bait. The audience notices and sides with you. Even so, you lose a point of composure: it hit a nerve.`,{q:e.q,schop:e.schop},d);
  }
  S.fase="name"; render();
}

function nameFal(k){
  const m=S.move, fa=FALACIAS[k];
  const fibra = m.f && FIBRA.has(m.f); if(fibra) S.temple=Math.max(0,S.temple-1); // it was disrespectful: it costs composure even if you catch it
  const notaFibra = fibra ? " And since it is also disrespectful, you lose a point of composure even though you caught it." : "";
  if(m.f===null){
    pushThread("you", `That’s “${fa.nombre}”.`);
    const d=-10; S.meter=clamp(S.meter+d);
    return showFB("lose","There was no trick there.",`It was a legitimate argument, and you accused it of ‘${fa.nombre}’. Calling out fallacies where there are none looks like dodging the topic, and the audience cools towards you.`,{},d);
  }
  const real=FALACIAS[m.f], alts=m.fAlt||[];
  if(k===m.f || alts.includes(k)){
    const elegida=FALACIAS[k];
    pushThread("you", `That’s “${elegida.nombre}”: ${elegida.q}`);
    const d=6+m.peso*3; S.meter=clamp(S.meter+d);
    let extra = m.peso>=3?" It was the core of its whole position: dismantling it was devastating.":(m.peso===1?" It was a minor trick, but hey, it counts.":"");
    if(alts.length){ const todas=[m.f,...alts].map(x=>FALACIAS[x].nombre).join(" and "); extra = ` This card hides two tricks at once (${todas}): either one counts.`+extra; }
    return showFB("win","Caught, and by name!",`It was <b>${elegida.nombre}</b> <span style="color:var(--muted)">(${elegida.tec})</span> and you force it to defend it.${extra}${notaFibra}`,{q:elegida.q},d);
  }
  if(fibra){ pushThread("you", `That’s “${fa.nombre}”…`); const d=-3; S.meter=clamp(S.meter+d);
    return showFB("mid","You saw the disrespect, but it wasn’t that fallacy.",`It was <b>${real.nombre}</b> <span style="color:var(--muted)">(${real.tec})</span>, not ‘${fa.nombre}’.${notaFibra}`,{q:real.q},d); }
  pushThread("you", `That’s “${fa.nombre}”…`);
  const d=-3; S.meter=clamp(S.meter+d);
  showFB("mid","You saw the trick, but it wasn’t that one.",`There was a trick, yes, but not ‘${fa.nombre}’: it was <b>${real.nombre}</b> <span style="color:var(--muted)">(${real.tec})</span>. Accusing it under the wrong name costs you: the audience sees that you don’t quite know what is wrong.`,{q:real.q},d);
}

/* ---------- Wildcards (08-10-2026): ‘How do you know?’ and ‘What’s in it for them?’, one of each per game ---------- */
const SIN_PRUEBAS = new Set(["famoso","todos","pocos","causa","siempre"]); // tricks that pretend to have support: they fall apart when you ask for evidence
function temaConInteres(){ return TEMAS[S.ti].opp.some(o=>o.interes); }
function comodinesHTML(){
  const c=S.comodines||{sabes:1,gana:1}; let h=`<div class="choices comodines fade" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:10px">`;
  h+=`<button class="btn choice" data-com="sabes" ${c.sabes?'':'disabled'}>★ How do you know?<small>${c.sabes?'asks for evidence; works even if you don’t know the trick’s name':'already used'}</small></button>`;
  if(temaConInteres()) h+=`<button class="btn choice" data-com="gana" ${c.gana?'':'disabled'}>★ What’s in it for them?<small>${c.gana?'looks for a hidden interest; with no signs of one, it costs you':'already used'}</small></button>`;
  return h+`</div>`;
}
function usarComodin(k){
  const m=S.move; S.comodines[k]=0;
  if(k==="sabes"){
    pushThread("you", "How do you know? What evidence do you have?");
    if(m.kind==="estrat"){ S.temple=Math.max(0,S.temple-1); return showFB("mid", "That wasn’t a claim.", "It was provoking you; asking how it knows does not stop it in its tracks, and the provocation has hit a nerve.", {}, 0); }
    if(m.f===null){ const d=-3; S.meter=clamp(S.meter+d); return showFB("lose", "It did know.", "It explains its reasons and the audience listens: it was a legitimate argument. Asking for evidence is fine, but here you have wasted the wildcard.", {}, d); }
    const fa=FALACIAS[m.f];
    if(FIBRA.has(m.f)) S.temple=Math.max(0,S.temple-1);
    if(SIN_PRUEBAS.has(m.f)){ const d=8; S.meter=clamp(S.meter+d); return showFB("win", "It had no evidence.", `You ask how it knows and it has nothing to show: its ‘${fa.nombre}’ is left without support. If you also name it, you score more.`, {q:fa.q}, d); }
    return showFB("mid", "Its trick wasn’t about evidence.", `It was ‘${fa.nombre}’: asking for evidence doesn’t fix that.`, {q:fa.q}, 0);
  }
  pushThread("you", "And what do you gain if I believe it?");
  if(m.kind==="arg" && m.interes){ const d=12; S.meter=clamp(S.meter+d); return showFB("win", "It had an interest!", `You ask what the speaker gains and it comes to light: ${m.interes} That doesn’t prove they are lying, but the audience no longer trusts them in the same way.`, {}, d); }
  if(m.kind==="estrat") S.temple=Math.max(0,S.temple-1);
  const d=-6; S.meter=clamp(S.meter+d); return showFB("lose", "You accuse it without signs.", "Nothing suggests it gains anything from this. Thinking about interests is part of critical thinking, but assuming bad faith without signs is attacking the person.", {}, d);
}

function chooseB(){
  const pool=shuffle(TEMAS[S.ti].counters.slice());
  // hand of 3 with at least one solid counterargument
  const solidos=pool.filter(c=>!c.f), tramp=pool.filter(c=>c.f);
  S.hand=shuffle([solidos[0], solidos[1]||solidos[0], (rnd()<0.6&&tramp[0])?tramp[0]:(solidos[2]||solidos[0])]).slice(0,3);
  // make sure there are 3 different ones if possible
  S.hand=[...new Set(S.hand)];
  let pi=0; while(S.hand.length<3 && pi<pool.length){ if(!S.hand.includes(pool[pi])) S.hand.push(pool[pi]); pi++; }
  S.fase="counter"; render();
}

function playCounter(i){
  const c=S.hand[i], m=S.move;
  if(m.kind==="estrat" || (m.f && FIBRA.has(m.f))) S.temple=Math.max(0,S.temple-1); // a provocation or a personal attack hits a nerve even if you ignore it
  pushThread("you", c.t);
  if(c.f){
    const fa=FALACIAS[c.f]; const d=-10; S.meter=clamp(S.meter+d);
    return showFB("lose","Your own blow was a trick.",`You hit back with <b>${fa.nombre}</b> <span style="color:var(--muted)">(${fa.tec})</span>, and the computer catches you. The audience marks you down for it.`,{q:fa.q},d);
  }
  const unchallenged = (m.kind==="arg" && m.f) ? m.peso : 0;
  // the computer has strength too (08-10-2026): legitimate argument 2, trick 1, provocation 2; a topic can set ‘fuerza’ per argument
  const rival = m.kind==="arg" ? (m.fuerza || (m.f ? 1 : 2)) : 2;
  const d = (c.str - rival)*5 - unchallenged*4;
  S.meter=clamp(S.meter+d);
  if(unchallenged===0){
    if(d<0) return showFB("lose", "Its argument weighed more.", `Your reason (strength ${c.str}) was weaker than what it had said. ${m.kind==="estrat"?"Ignoring its provocation is fine, but you needed a more solid answer.":"There was no trick to call out: a stronger reason was called for."}`,{},d);
    return showFB(d>0?"win":"mid", d>0?"Good counterargument.":"A draw this turn.", `You answered with a reason of strength ${c.str}. ${m.kind==="estrat"?"And you rose above its provocation: elegant.":"Its move had no trick; this was the time to argue."}`,{},d);
  }
  if(d>0){
    const fa=FALACIAS[m.f];
    return showFB("win","You hit harder than its trick.",`You let its <b>${fa.nombre}</b> pass (a minor trick) and delivered a powerful counterargument. Sometimes it pays not to waste time correcting: the audience keeps your reason.`,{},d);
  }
  const fa=FALACIAS[m.f];
  return showFB("lose","Its trick was still standing.",`Its <b>${fa.nombre}</b> was the core of its position and you let it pass; your counterargument wasn’t strong enough for that. Here it would have been better to <b>call it out</b>.`,{q:fa.q},d);
}

function reaccion(i){
  pushThread("you", REACCIONES[i].t);
  const d=-12; S.meter=clamp(S.meter+d); S.temple=1;
  showFB("lose","You’ve lost it.",`Thrown off balance, all you could do was ${REACCIONES[i].lbl.toLowerCase()}. The audience goes over to the computer. That’s why the first thing is not to take the bait.`,{},d);
}

function showFB(cls, head, body, extra, delta, cont){
  extra=extra||{};
  const last=(S.turno+1>=MAXT);
  const dtxt = (typeof delta==="number" && delta!==0) ? `<div class="name">Audience conviction: <span class="delta ${delta>0?'pos':'neg'}">${delta>0?'+':''}${delta}</span> → ${S.meter}%</div>`:``;
  let html=hud()+threadHTML();
  html+=`<div class="fb ${cls} fade">
     <div class="head">${cls==='win'?'✓':(cls==='lose'?'✕':'◆')} ${head}</div>
     <div class="name">${body}</div>
     ${dtxt}
     ${extra.q?`<div class="desmonta">To dismantle it: <b>${extra.q}</b></div>`:``}
     ${extra.schop?`<div class="schop">Schopenhauer recorded it as <b>${extra.schop}</b> in ‘The Art of Being Right’.</div>`:``}
   </div>
   <div class="choices" style="margin-top:12px"><button class="btn btn-primary" id="cont">${last?'See the verdict':'Continue the debate'}</button></div>`;
  app().innerHTML=html; scrollThread();
  document.getElementById('cont').onclick = cont || (()=>{ S.turno++; nextTurn(false); });
}

function renderEnd(){
  const you=S.meter, win=you>55, lose=you<45;
  const cls=win?'win':(lose?'lose':'tie');
  const titulo=win?'You convinced the audience':(lose?'The audience went over to the computer':'A close debate, with no clear winner');
  const msg=win?'You knew when to call out a trick and when to hit hard with a reason, without losing your cool. That is arguing well.'
    :(lose?'Tricks slipped past you, or you spent turns on trifles while the big things went unanswered, or you were thrown off balance. Look at the meter and try a different line.'
      :'It was evenly matched. Sharpen when to call out the fallacy and when to counterattack, and you will tip it in your favour.');
  app().innerHTML=`${hud()}
    <div class="intro center fade">
      <div class="eyebrow">End of the debate</div>
      <div class="verdict ${cls}">${you}% of the audience</div>
      <h2>${titulo}</h2>
      <p class="lede" style="margin-top:10px">${msg}</p>
      <div class="pick" style="margin-top:18px">
        <button class="btn btn-primary" id="again">Debate again (this topic)</button>
        <button class="btn" id="home">Choose another topic</button>
      </div>
    </div>`;
  document.getElementById('again').onclick=()=>{ _seed=(Date.now()&0x7fffffff)||1; const ti=S.ti; S=freshState(ti); S.fase="turn"; nextTurn(true); };
  document.getElementById('home').onclick=()=>{ S=null; renderIntro(); };
}

/* ---------- Light/dark theme ---------- */
(function(){
  const root=document.documentElement, btn=document.getElementById('theme');
  let saved=null; try{saved=localStorage.getItem('dr_theme');}catch(e){}
  if(saved) root.setAttribute('data-theme',saved);
  btn.onclick=()=>{ const cur=root.getAttribute('data-theme');
    const dark=cur? cur==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
    const next=dark?'light':'dark'; root.setAttribute('data-theme',next);
    try{localStorage.setItem('dr_theme',next);}catch(e){} };
})();

/* ---------- Start-up with hot-reload ---------- */
function start(data){ if(data&&data.S){ S=data.S; if(typeof data.seed==='number') _seed=data.seed; } else { S=null; } render(); }
try{ window.claude?.hot?.snapshot && window.claude.hot.snapshot(()=>({S, seed:_seed})); }catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
